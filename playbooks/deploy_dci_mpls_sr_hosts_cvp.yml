---
# 테스트 엔드포인트(s1-host1/2, s2-host1/2)는 eos_designs 대상이 아니라
# host_configs/*.cfg 정적 설정을 그대로 CVP 로 배포합니다.
- name: Deploying MPLS-SR DCI Lab Host Configs via CVP
  hosts: DC1_HOSTS:DC2_HOSTS
  connection: local
  gather_facts: false
  tasks:
    - name: Deploy configurations and tags to CloudVision
      ansible.builtin.import_role:
        name: arista.avd.cv_deploy
      vars:
        cv_server: cvp
        cv_username: "{{ ansible_user }}"
        cv_password: "{{ ansible_password }}"
        cv_verify_certs: false
        cv_run_change_control: true
        read_structured_config_from_file: false
        eos_config_dir: "{{ inventory_dir }}/host_configs"
