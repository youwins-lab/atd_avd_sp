---
# SP 코어(eos1~eos8)의 AVD 설정을 생성합니다. 고객 CE 는 AVD 대상이 아닙니다.
- name: Build MPLS-SR Service Provider Configurations
  hosts: SP_FABRIC
  gather_facts: false
  tasks:

    - name: Generate Structured Configuration per Device
      ansible.builtin.import_role:
        name: arista.avd.eos_designs

    - name: Generate Intended Config and Documentation
      ansible.builtin.import_role:
        name: arista.avd.eos_cli_config_gen
