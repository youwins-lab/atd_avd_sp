---
# AVD 가 생성한 설정을 CloudVision 을 통해 배포합니다 (change control 자동 생성/실행).
- name: Deploying MPLS-SR DCI Lab Changes via CVP
  hosts: MPLS_SR_DCI_FABRIC
  connection: local
  gather_facts: false
  tasks:
    - name: Deploy configurations and tags to CloudVision
      ansible.builtin.import_role:
        name: arista.avd.cv_deploy
      vars:
        cv_server: cvp
        cv_username: "{{ ansible_user }}"
        cv_password: "{{ ansible_password }}"
        cv_verify_certs: false
        cv_run_change_control: true
