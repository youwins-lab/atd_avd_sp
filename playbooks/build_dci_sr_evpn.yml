---
# DC1 / DC2 EVPN VXLAN 패브릭과 MPLS-SR WAN 코어를 한 번에 빌드합니다.
# 세 도메인이 서로의 facts 를 참조하므로(GW 의 RR Client 관계 등) 하나의 플레이에서 돌립니다.
- name: Build DCI MPLS-SR EVPN WAN Core Lab Configurations
  hosts: DCI_SR_FABRIC
  gather_facts: false
  tasks:

    - name: Generate Structured Configuration per Device
      ansible.builtin.import_role:
        name: arista.avd.eos_designs

    - name: Generate Intended Config and Documentation
      ansible.builtin.import_role:
        name: arista.avd.eos_cli_config_gen
