---
# DC1 / DC2 EVPN-VXLAN 패브릭과 MPLS-SR DCI 코어를 한 번에 빌드합니다.
# 세 패브릭(DC1_FABRIC / DC2_FABRIC / DCI_CORE)이 서로의 facts 를 참조해야 하므로
# (Border Leaf 의 evpn_gateway remote_peers, 코어의 RR/Client 관계 등) 하나의 플레이에서
# 함께 돌립니다.
- name: Build MPLS-SR DCI Lab Configurations
  hosts: MPLS_SR_DCI_FABRIC
  gather_facts: false
  tasks:

    - name: Generate Structured Configuration per Device
      ansible.builtin.import_role:
        name: arista.avd.eos_designs

    - name: Generate Intended Config and Documentation
      ansible.builtin.import_role:
        name: arista.avd.eos_cli_config_gen
