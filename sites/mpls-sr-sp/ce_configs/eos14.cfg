! ==========================================================================================
! eos14 - Customer 2 CE (L2VPN / E-LAN)
!   Et1 -> eos8:Et4,  Et2 -> eos6:Et6  -> PE 2대 듀얼호밍
!
! PE 쪽은 EVPN Ethernet Segment(all-active)로 묶여 있으므로, CE 는 두 링크를 하나의
! LACP Port-Channel 로 올려야 합니다. 그래야 두 PE 모두로 트래픽이 흐르면서 L2 루프가
! 생기지 않습니다. 고객 IP 는 이 Port-Channel 에 붙습니다 (라우팅 없이 같은 서브넷).
! ==========================================================================================
interface Ethernet1
   description CUST2_LAG_TO_eos8_Ethernet4
   channel-group 1 mode active
!
interface Ethernet2
   description CUST2_LAG_TO_eos6_Ethernet6
   channel-group 1 mode active
!
interface Port-Channel1
   description CUST2_L2VPN
   no switchport
   mtu 9214
   ip address 10.0.0.14/24
