! ==========================================================================================
! eos16 - Customer 3 CE (E-LINE)
!   Et1 -> eos4:Et6  ==[ MPLS VPWS pseudowire ]==  eos1:Et6 -> eos17
! pseudowire 가 포트 모드라 eos17 과 직결된 것처럼 같은 서브넷을 씁니다.
! 이미 배정된 주소 그대로이며 변경 사항은 없습니다.
! ==========================================================================================
interface Ethernet1
   description CUST3_ELINE_TO_eos17_VIA_eos4
   no switchport
   ip address 10.16.17.16/24
