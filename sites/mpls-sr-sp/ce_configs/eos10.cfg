! ==========================================================================================
! eos10 - Customer 2 CE (L2VPN / E-LAN) - 단일 연결
!   Et1 -> eos7:Et2
! 이미 랩에 배정된 주소 그대로입니다. 변경 사항 없이 상태만 확정(idempotent)합니다.
