! ==========================================================================================
! eos9 - Customer 2 CE (L2VPN / E-LAN)
!   Et1 -> eos4:Et1,  Et2 -> eos3:Et1  -> PE 2대 듀얼호밍 (EVPN ESI all-active)
! ==========================================================================================
interface Ethernet1
   description CUST2_LAG_TO_eos4_Ethernet1
   channel-group 1 mode active
!
interface Ethernet2
   description CUST2_LAG_TO_eos3_Ethernet1
   channel-group 1 mode active
!
interface Port-Channel1
   description CUST2_L2VPN
   no switchport
   mtu 9214
   ip address 10.0.0.9/24
