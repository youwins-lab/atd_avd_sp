!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname eos1
!
spanning-tree mode none
!
vrf instance CUST1
   description Customer 1 L3VPN Service
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
interface Ethernet1
   description P2P_eos2_Ethernet5
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.2.1/24
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 10
   isis hello padding
   isis network point-to-point
!
interface Ethernet2
   description P2P_eos7_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.7.1/24
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 10
   isis hello padding
   isis network point-to-point
!
interface Ethernet3
   description CUST1_eos11
   no shutdown
   mtu 9214
   no switchport
   vrf CUST1
   ip address 10.1.11.1/24
!
interface Ethernet4
   description P2P_eos6_Ethernet4
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.6.1/24
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 10
   isis hello padding
   isis network point-to-point
!
interface Ethernet5
   description P2P_eos5_Ethernet4
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.5.1/24
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 10
   isis hello padding
   isis network point-to-point
!
interface Ethernet6
   no shutdown
   no switchport
   no lldp transmit
   no lldp receive
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 1.1.1.1/32
   node-segment ipv4 index 1
   isis enable CORE
   isis passive
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.10/24
!
ip routing
ip routing vrf CUST1
!
ip route 0.0.0.0/0 192.168.0.1
!
mpls ip
!
patch panel
   patch CUST3-ELINE
      connector 1 interface Ethernet6
      !
      connector 2 pseudowire bgp vpws SP pseudowire CUST3-ELINE
   !
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65000
   router-id 1.1.1.1
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   graceful-restart restart-time 300
   graceful-restart
   neighbor MPLS-OVERLAY-PEERS peer group
   neighbor MPLS-OVERLAY-PEERS remote-as 65000
   neighbor MPLS-OVERLAY-PEERS update-source Loopback0
   neighbor MPLS-OVERLAY-PEERS bfd
   neighbor MPLS-OVERLAY-PEERS password 7 RgvjapM5jk5o2NL5xGPumydWd3N3ApiZ
   neighbor MPLS-OVERLAY-PEERS send-community
   neighbor MPLS-OVERLAY-PEERS maximum-routes 0
   neighbor 2.2.2.2 peer group MPLS-OVERLAY-PEERS
   neighbor 2.2.2.2 description eos2_Loopback0
   neighbor 5.5.5.5 peer group MPLS-OVERLAY-PEERS
   neighbor 5.5.5.5 description eos5_Loopback0
   !
   vpws SP
      rd 1.1.1.1:500
      route-target import export evpn 500:500
      mtu 9214
      !
      pseudowire CUST3-ELINE
         evpn vpws id local 317 remote 316
   !
   address-family evpn
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
      neighbor MPLS-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor MPLS-OVERLAY-PEERS activate
   !
   address-family vpn-ipv4
      neighbor MPLS-OVERLAY-PEERS activate
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
   !
   vrf CUST1
      rd 1.1.1.1:101
      route-target import vpn-ipv4 101:101
      route-target import vpn-ipv4 199:199
      route-target export vpn-ipv4 101:101
      router-id 1.1.1.1
      update wait-install
      neighbor 10.1.11.11 remote-as 65011
      neighbor 10.1.11.11 description eos11
      neighbor 10.1.11.11 maximum-routes 0
      redistribute connected
      !
      address-family ipv4
         neighbor 10.1.11.11 activate
!
router isis CORE
   net 49.0001.0010.0100.1001.00
   router-id ipv4 1.1.1.1
   is-type level-2
   log-adjacency-changes
   timers local-convergence-delay 10000 protected-prefixes
   !
   address-family ipv4 unicast
      maximum-paths 4
      fast-reroute ti-lfa mode link-protection
   !
   segment-routing mpls
      no shutdown
!
end
