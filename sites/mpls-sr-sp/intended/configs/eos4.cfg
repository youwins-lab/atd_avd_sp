!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname eos4
!
spanning-tree mode none
!
vlan 100
   name CUST2-L2VPN
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
interface Port-Channel1
   description ROUTER_eos9
   no shutdown
   mtu 9214
   switchport access vlan 100
   switchport mode access
   switchport
   !
   evpn ethernet-segment
      identifier 0000:0000:278f:707a:a872
      redundancy all-active
      route-target import 27:8f:70:7a:a8:72
   lacp system-id 278f.707a.a872
!
interface Ethernet1
   description CUST2_eos9
   no shutdown
   channel-group 1 mode active
!
interface Ethernet2
   description P2P_eos8_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.4.8.4/24
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 10
   isis hello padding
   isis network point-to-point
!
interface Ethernet3
   description P2P_eos5_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.4.5.4/24
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 10
   isis hello padding
   isis network point-to-point
!
interface Ethernet4
   description P2P_eos2_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.2.4.4/24
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 10
   isis hello padding
   isis network point-to-point
!
interface Ethernet5
   description P2P_eos3_Ethernet5
   no shutdown
   mtu 9214
   no switchport
   ip address 10.3.4.4/24
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 10
   isis hello padding
   isis network point-to-point
!
interface Ethernet6
   no shutdown
   no switchport
   no lldp transmit
   no lldp receive
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 4.4.4.4/32
   node-segment ipv4 index 4
   isis enable CORE
   isis passive
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.13/24
!
ip routing
!
ip route 0.0.0.0/0 192.168.0.1
!
mpls ip
!
patch panel
   patch CUST3-ELINE
      connector 1 interface Ethernet6
      !
      connector 2 pseudowire bgp vpws SP pseudowire CUST3-ELINE
   !
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65000
   router-id 4.4.4.4
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   graceful-restart restart-time 300
   graceful-restart
   neighbor MPLS-OVERLAY-PEERS peer group
   neighbor MPLS-OVERLAY-PEERS remote-as 65000
   neighbor MPLS-OVERLAY-PEERS update-source Loopback0
   neighbor MPLS-OVERLAY-PEERS bfd
   neighbor MPLS-OVERLAY-PEERS password 7 N5U6i+3vPyc1DrMdKl+ljQ==
   neighbor MPLS-OVERLAY-PEERS send-community
   neighbor MPLS-OVERLAY-PEERS maximum-routes 0
   neighbor 2.2.2.2 peer group MPLS-OVERLAY-PEERS
   neighbor 2.2.2.2 description eos2_Loopback0
   neighbor 5.5.5.5 peer group MPLS-OVERLAY-PEERS
   neighbor 5.5.5.5 description eos5_Loopback0
   !
   vlan 100
      rd 4.4.4.4:10100
      route-target both 10100:10100
      redistribute learned
   !
   vpws SP
      rd 4.4.4.4:500
      route-target import export evpn 500:500
      mtu 9214
      !
      pseudowire CUST3-ELINE
         evpn vpws id local 316 remote 317
   !
   address-family evpn
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
      neighbor MPLS-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor MPLS-OVERLAY-PEERS activate
   !
   address-family vpn-ipv4
      neighbor MPLS-OVERLAY-PEERS activate
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
!
router isis CORE
   net 49.0001.0040.0400.4004.00
   router-id ipv4 4.4.4.4
   is-type level-2
   log-adjacency-changes
   timers local-convergence-delay 10000 protected-prefixes
   !
   address-family ipv4 unicast
      maximum-paths 4
      fast-reroute ti-lfa mode link-protection
   !
   segment-routing mpls
      no shutdown
!
end
