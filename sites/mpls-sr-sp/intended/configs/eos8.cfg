!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname eos8
!
spanning-tree mode none
!
vlan 100
   name CUST2-L2VPN
!
vrf instance CUST1
   description Customer 1 L3VPN Service
!
vrf instance CUST4
   description Customer 4 L3VPN Service
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
interface Port-Channel4
   description ROUTER_eos14
   no shutdown
   mtu 9214
   switchport access vlan 100
   switchport mode access
   switchport
   !
   evpn ethernet-segment
      identifier 0000:0000:0375:406d:88c1
      redundancy all-active
      route-target import 03:75:40:6d:88:c1
   lacp system-id 0375.406d.88c1
!
interface Ethernet1
   description P2P_eos4_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.4.8.8/24
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 10
   isis hello padding
   isis network point-to-point
!
interface Ethernet2
   description CUST1_eos15
   no shutdown
   mtu 9214
   no switchport
   vrf CUST1
   ip address 10.8.15.8/24
!
interface Ethernet3
   description P2P_eos6_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.6.8.8/24
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 10
   isis hello padding
   isis network point-to-point
!
interface Ethernet4
   description CUST2_eos14
   no shutdown
   channel-group 4 mode active
!
interface Ethernet5
   description CUST4_eos18
   no shutdown
   mtu 9214
   no switchport
   vrf CUST4
   ip address 10.8.18.8/24
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 8.8.8.8/32
   node-segment ipv4 index 8
   isis enable CORE
   isis passive
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.17/24
!
ip routing
ip routing vrf CUST1
ip routing vrf CUST4
!
ip route 0.0.0.0/0 192.168.0.1
!
mpls ip
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65000
   router-id 8.8.8.8
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   graceful-restart restart-time 300
   graceful-restart
   neighbor MPLS-OVERLAY-PEERS peer group
   neighbor MPLS-OVERLAY-PEERS remote-as 65000
   neighbor MPLS-OVERLAY-PEERS update-source Loopback0
   neighbor MPLS-OVERLAY-PEERS bfd
   neighbor MPLS-OVERLAY-PEERS password 7 N5U6i+3vPyc1DrMdKl+ljQ==
   neighbor MPLS-OVERLAY-PEERS send-community
   neighbor MPLS-OVERLAY-PEERS maximum-routes 0
   neighbor 2.2.2.2 peer group MPLS-OVERLAY-PEERS
   neighbor 2.2.2.2 description eos2_Loopback0
   neighbor 5.5.5.5 peer group MPLS-OVERLAY-PEERS
   neighbor 5.5.5.5 description eos5_Loopback0
   !
   vlan 100
      rd 8.8.8.8:10100
      route-target both 10100:10100
      redistribute learned
   !
   address-family evpn
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
      neighbor MPLS-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor MPLS-OVERLAY-PEERS activate
   !
   address-family vpn-ipv4
      neighbor MPLS-OVERLAY-PEERS activate
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
   !
   vrf CUST1
      rd 8.8.8.8:101
      route-target import vpn-ipv4 101:101
      route-target import vpn-ipv4 199:199
      route-target export vpn-ipv4 101:101
      router-id 8.8.8.8
      update wait-install
      neighbor 10.8.15.15 remote-as 65015
      neighbor 10.8.15.15 description eos15
      neighbor 10.8.15.15 maximum-routes 0
      redistribute connected
      !
      address-family ipv4
         neighbor 10.8.15.15 activate
   !
   vrf CUST4
      rd 8.8.8.8:104
      route-target import vpn-ipv4 104:104
      route-target import vpn-ipv4 199:199
      route-target export vpn-ipv4 104:104
      router-id 8.8.8.8
      update wait-install
      neighbor 10.8.18.18 remote-as 65018
      neighbor 10.8.18.18 description eos18
      neighbor 10.8.18.18 maximum-routes 0
      redistribute connected
      !
      address-family ipv4
         neighbor 10.8.18.18 activate
!
router isis CORE
   net 49.0001.0080.0800.8008.00
   router-id ipv4 8.8.8.8
   is-type level-2
   log-adjacency-changes
   timers local-convergence-delay 10000 protected-prefixes
   !
   address-family ipv4 unicast
      maximum-paths 4
      fast-reroute ti-lfa mode link-protection
   !
   segment-routing mpls
      no shutdown
!
end
