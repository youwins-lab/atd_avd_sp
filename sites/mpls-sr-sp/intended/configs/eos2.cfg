!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname eos2
!
spanning-tree mode none
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
interface Ethernet1
   description P2P_eos3_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.2.3.2/24
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 10
   isis hello padding
   isis network point-to-point
!
interface Ethernet2
   description P2P_eos4_Ethernet4
   no shutdown
   mtu 9214
   no switchport
   ip address 10.2.4.2/24
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 10
   isis hello padding
   isis network point-to-point
!
interface Ethernet3
   description P2P_eos5_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.2.5.2/24
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 10
   isis hello padding
   isis network point-to-point
!
interface Ethernet4
   description P2P_eos6_Ethernet5
   no shutdown
   mtu 9214
   no switchport
   ip address 10.2.6.2/24
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 10
   isis hello padding
   isis network point-to-point
!
interface Ethernet5
   description P2P_eos1_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.2.2/24
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 10
   isis hello padding
   isis network point-to-point
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 2.2.2.2/32
   node-segment ipv4 index 2
   isis enable CORE
   isis passive
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.11/24
!
ip routing
!
ip route 0.0.0.0/0 192.168.0.1
!
mpls ip
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65000
   router-id 2.2.2.2
   update wait-install
   no bgp default ipv4-unicast
   bgp cluster-id 2.2.2.2
   maximum-paths 4
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   graceful-restart restart-time 300
   graceful-restart
   neighbor MPLS-OVERLAY-PEERS peer group
   neighbor MPLS-OVERLAY-PEERS remote-as 65000
   neighbor MPLS-OVERLAY-PEERS update-source Loopback0
   neighbor MPLS-OVERLAY-PEERS bfd
   neighbor MPLS-OVERLAY-PEERS route-reflector-client
   neighbor MPLS-OVERLAY-PEERS password 7 N5U6i+3vPyc1DrMdKl+ljQ==
   neighbor MPLS-OVERLAY-PEERS send-community
   neighbor MPLS-OVERLAY-PEERS maximum-routes 0
   neighbor RR-OVERLAY-PEERS peer group
   neighbor RR-OVERLAY-PEERS remote-as 65000
   neighbor RR-OVERLAY-PEERS update-source Loopback0
   neighbor RR-OVERLAY-PEERS bfd
   neighbor RR-OVERLAY-PEERS password 7 N5U6i+3vPyc1DrMdKl+ljQ==
   neighbor RR-OVERLAY-PEERS send-community
   neighbor RR-OVERLAY-PEERS maximum-routes 0
   neighbor 1.1.1.1 peer group MPLS-OVERLAY-PEERS
   neighbor 1.1.1.1 description eos1_Loopback0
   neighbor 3.3.3.3 peer group MPLS-OVERLAY-PEERS
   neighbor 3.3.3.3 description eos3_Loopback0
   neighbor 4.4.4.4 peer group MPLS-OVERLAY-PEERS
   neighbor 4.4.4.4 description eos4_Loopback0
   neighbor 5.5.5.5 peer group RR-OVERLAY-PEERS
   neighbor 5.5.5.5 description eos5_Loopback0
   neighbor 6.6.6.6 peer group MPLS-OVERLAY-PEERS
   neighbor 6.6.6.6 description eos6_Loopback0
   neighbor 7.7.7.7 peer group MPLS-OVERLAY-PEERS
   neighbor 7.7.7.7 description eos7_Loopback0
   neighbor 8.8.8.8 peer group MPLS-OVERLAY-PEERS
   neighbor 8.8.8.8 description eos8_Loopback0
   !
   address-family evpn
      neighbor default encapsulation mpls
      neighbor MPLS-OVERLAY-PEERS activate
      neighbor RR-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor MPLS-OVERLAY-PEERS activate
      no neighbor RR-OVERLAY-PEERS activate
   !
   address-family vpn-ipv4
      neighbor MPLS-OVERLAY-PEERS activate
      neighbor RR-OVERLAY-PEERS activate
!
router isis CORE
   net 49.0001.0020.0200.2002.00
   router-id ipv4 2.2.2.2
   is-type level-2
   log-adjacency-changes
   timers local-convergence-delay 10000 protected-prefixes
   !
   address-family ipv4 unicast
      maximum-paths 4
      fast-reroute ti-lfa mode link-protection
   !
   segment-routing mpls
      no shutdown
!
end
