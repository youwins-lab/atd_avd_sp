    identifier: 0000:0000:278f:707a:a872
    redundancy: all-active
    route_target: 27:8f:70:7a:a8:72
  lacp_id: 278f.707a.a872
  switchport:
    enabled: true
    mode: access
    access_vlan: 100
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65000'
  router_id: 3.3.3.3
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp_defaults:
  - no bgp default ipv4-unicast
  - distance bgp 20 200 200
  - graceful-restart restart-time 300
  - graceful-restart
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MPLS-OVERLAY-PEERS
    metadata:
      type: mpls
    remote_as: '65000'
    update_source: Loopback0
    bfd: true
    password: RgvjapM5jk5o2NL5xGPumydWd3N3ApiZ
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 2.2.2.2
    peer_group: MPLS-OVERLAY-PEERS
    metadata:
      peer: eos2
    description: eos2_Loopback0
  - ip_address: 5.5.5.5
    peer_group: MPLS-OVERLAY-PEERS
    metadata:
      peer: eos5
    description: eos5_Loopback0
  vlans:
  - id: 100
    metadata:
      tenants:
      - SP
    rd: 3.3.3.3:10100
    route_targets:
      both:
      - 10100:10100
    redistribute_routes:
    - learned
  address_family_evpn:
    neighbor_default:
      encapsulation: mpls
      next_hop_self_source_interface: Loopback0
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: false
  address_family_vpn_ipv4:
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: true
    neighbor_default_encapsulation_mpls_next_hop_self:
      source_interface: Loopback0
  vrfs:
  - name: CENTRAL
    rd: 3.3.3.3:199
    route_targets:
      import:
      - address_family: vpn-ipv4
        route_targets:
        - 199:199
        - 101:101
        - 104:104
      export:
      - address_family: vpn-ipv4
        route_targets:
        - 199:199
    router_id: 3.3.3.3
    updates:
      wait_install: true
    neighbors:
    - ip_address: 10.3.20.20
      remote_as: '65020'
      description: eos20
      maximum_routes: 0
    redistribute:
      connected:
        enabled: true
    address_family_ipv4:
      neighbors:
      - ip_address: 10.3.20.20
        activate: true
