hostname: eos1
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 1.1.1.1/32
  isis_enable: CORE
  isis_passive: true
  node_segment:
    ipv4_index: 1
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: default
management_interfaces:
- name: Management0
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: default
  ip_address: 192.168.0.10/24
  type: oob
  gateway: 192.168.0.1
metadata:
  is_deployed: true
  platform: ceos
  fabric_name: SP_FABRIC
  cv_tags:
    device_tags:
    - name: topology_hint_fabric
      value: SP_FABRIC
mpls:
  ip: true
patch_panel:
  patches:
  - name: CUST3-ELINE
    enabled: true
    connectors:
    - id: '1'
      type: interface
      endpoint: Ethernet6
    - id: '2'
      type: pseudowire
      endpoint: bgp vpws SP pseudowire CUST3-ELINE
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65000'
  router_id: 1.1.1.1
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp_defaults:
  - no bgp default ipv4-unicast
  - distance bgp 20 200 200
  - graceful-restart restart-time 300
  - graceful-restart
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MPLS-OVERLAY-PEERS
    metadata:
      type: mpls
    remote_as: '65000'
    update_source: Loopback0
    bfd: true
    password: RgvjapM5jk5o2NL5xGPumydWd3N3ApiZ
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 2.2.2.2
    peer_group: MPLS-OVERLAY-PEERS
    metadata:
      peer: eos2
    description: eos2_Loopback0
  - ip_address: 5.5.5.5
    peer_group: MPLS-OVERLAY-PEERS
    metadata:
      peer: eos5
    description: eos5_Loopback0
  vpws:
  - name: SP
    rd: 1.1.1.1:500
    route_targets:
      import_export: 500:500
    mtu: 9214
    pseudowires:
    - name: CUST3-ELINE
      id_local: 317
      id_remote: 316
  address_family_evpn:
    neighbor_default:
      encapsulation: mpls
      next_hop_self_source_interface: Loopback0
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: false
  address_family_vpn_ipv4:
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: true
    neighbor_default_encapsulation_mpls_next_hop_self:
      source_interface: Loopback0
  vrfs:
  - name: CUST1
    rd: 1.1.1.1:101
    route_targets:
      import:
      - address_family: vpn-ipv4
        route_targets:
        - 101:101
        - 199:199
      export:
      - address_family: vpn-ipv4
        route_targets:
        - 101:101
    router_id: 1.1.1.1
    updates:
      wait_install: true
    neighbors:
    - ip_address: 10.1.11.11
      remote_as: '65011'
      description: eos11
      maximum_routes: 0
    redistribute:
      connected:
        enabled: true
    address_family_ipv4:
      neighbors:
      - ip_address: 10.1.11.11
        activate: true
router_isis:
  instance: CORE
  net: 49.0001.0010.0100.1001.00
  router_id: 1.1.1.1
  is_type: level-2
  log_adjacency_changes: true
  timers:
    local_convergence:
      protected_prefixes: true
      delay: 10000
  address_family_ipv4:
    enabled: true
    maximum_paths: 4
    fast_reroute_ti_lfa:
      mode: link-protection
  segment_routing_mpls:
    enabled: true
    router_id: 1.1.1.1
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
static_routes:
- vrf: default
  prefix: 0.0.0.0/0
  next_hop: 192.168.0.1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: default
  ip_routing: false
- name: CUST1
  description: Customer 1 L3VPN Service
  ip_routing: true
  metadata:
    tenants:
    - SP
