hostname: eos7
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 7.7.7.7/32
  isis_enable: CORE
  isis_passive: true
  node_segment:
    ipv4_index: 7
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: default
management_interfaces:
- name: Management0
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: default
  ip_address: 192.168.0.16/24
  type: oob
  gateway: 192.168.0.1
metadata:
  is_deployed: true
  platform: ceos
  fabric_name: SP_FABRIC
  cv_tags:
    device_tags:
    - name: topology_hint_fabric
      value: SP_FABRIC
mpls:
  ip: true
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65000'
  router_id: 7.7.7.7
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp_defaults:
  - no bgp default ipv4-unicast
  - distance bgp 20 200 200
  - graceful-restart restart-time 300
  - graceful-restart
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MPLS-OVERLAY-PEERS
    metadata:
      type: mpls
    remote_as: '65000'
    update_source: Loopback0
    bfd: true
    password: RgvjapM5jk5o2NL5xGPumydWd3N3ApiZ
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 2.2.2.2
    peer_group: MPLS-OVERLAY-PEERS
    metadata:
      peer: eos2
    description: eos2_Loopback0
  - ip_address: 5.5.5.5
    peer_group: MPLS-OVERLAY-PEERS
    metadata:
      peer: eos5
    description: eos5_Loopback0
  vlans:
  - id: 100
    metadata:
      tenants:
      - SP
    rd: 7.7.7.7:10100
    route_targets:
      both:
      - 10100:10100
    redistribute_routes:
    - learned
  address_family_evpn:
    neighbor_default:
      encapsulation: mpls
      next_hop_self_source_interface: Loopback0
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: false
  address_family_vpn_ipv4:
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: true
    neighbor_default_encapsulation_mpls_next_hop_self:
      source_interface: Loopback0
  vrfs:
  - name: CUST4
    rd: 7.7.7.7:104
    route_targets:
      import:
      - address_family: vpn-ipv4
        route_targets:
        - 104:104
        - 199:199
      export:
      - address_family: vpn-ipv4
        route_targets:
        - 104:104
    router_id: 7.7.7.7
    updates:
      wait_install: true
    neighbors:
    - ip_address: 10.7.19.19
      remote_as: '65019'
      description: eos19
      maximum_routes: 0
    redistribute:
      connected:
        enabled: true
    address_family_ipv4:
      neighbors:
      - ip_address: 10.7.19.19
        activate: true
router_isis:
  instance: CORE
  net: 49.0001.0070.0700.7007.00
  router_id: 7.7.7.7
  is_type: level-2
  log_adjacency_changes: true
  timers:
    local_convergence:
      protected_prefixes: true
      delay: 10000
  address_family_ipv4:
    enabled: true
    maximum_paths: 4
    fast_reroute_ti_lfa:
      mode: link-protection
  segment_routing_mpls:
    enabled: true
    router_id: 7.7.7.7
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
static_routes:
- vrf: default
  prefix: 0.0.0.0/0
  next_hop: 192.168.0.1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
