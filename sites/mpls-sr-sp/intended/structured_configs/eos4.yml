    connectors:
    - id: '1'
      type: interface
      endpoint: Ethernet6
    - id: '2'
      type: pseudowire
      endpoint: bgp vpws SP pseudowire CUST3-ELINE
port_channel_interfaces:
- name: Port-Channel1
  description: ROUTER_eos9
  shutdown: false
  mtu: 9214
  evpn_ethernet_segment:
    identifier: 0000:0000:278f:707a:a872
    redundancy: all-active
    route_target: 27:8f:70:7a:a8:72
  lacp_id: 278f.707a.a872
  switchport:
    enabled: true
    mode: access
    access_vlan: 100
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65000'
  router_id: 4.4.4.4
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp_defaults:
  - no bgp default ipv4-unicast
  - distance bgp 20 200 200
  - graceful-restart restart-time 300
  - graceful-restart
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MPLS-OVERLAY-PEERS
    metadata:
      type: mpls
    remote_as: '65000'
    update_source: Loopback0
    bfd: true
    password: RgvjapM5jk5o2NL5xGPumydWd3N3ApiZ
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 2.2.2.2
    peer_group: MPLS-OVERLAY-PEERS
    metadata:
      peer: eos2
    description: eos2_Loopback0
  - ip_address: 5.5.5.5
    peer_group: MPLS-OVERLAY-PEERS
    metadata:
      peer: eos5
    description: eos5_Loopback0
  vlans:
  - id: 100
    metadata:
      tenants:
      - SP
    rd: 4.4.4.4:10100
    route_targets:
      both:
      - 10100:10100
    redistribute_routes:
    - learned
  vpws:
  - name: SP
    rd: 4.4.4.4:500
    route_targets:
      import_export: 500:500
    mtu: 9214
    pseudowires:
    - name: CUST3-ELINE
      id_local: 316
      id_remote: 317
  address_family_evpn:
    neighbor_default:
      encapsulation: mpls
      next_hop_self_source_interface: Loopback0
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: false
  address_family_vpn_ipv4:
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: true
    neighbor_default_encapsulation_mpls_next_hop_self:
      source_interface: Loopback0
router_isis:
