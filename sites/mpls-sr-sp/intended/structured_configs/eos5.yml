aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet4
  description: P2P_eos1_Ethernet5
  shutdown: false
  mtu: 9214
  ip_address: 10.1.5.5/24
  isis_enable: CORE
  isis_metric: 10
  isis_network_point_to_point: true
  isis_circuit_type: level-2
  isis_hello_padding: true
  mpls:
    ip: true
  metadata:
    peer: eos1
    peer_interface: Ethernet5
    peer_type: pe
  switchport:
    enabled: false
- name: Ethernet3
  description: P2P_eos2_Ethernet3
  shutdown: false
  mtu: 9214
  ip_address: 10.2.5.5/24
  isis_enable: CORE
  isis_metric: 10
  isis_network_point_to_point: true
  isis_circuit_type: level-2
  isis_hello_padding: true
  mpls:
    ip: true
  metadata:
    peer: eos2
    peer_interface: Ethernet3
    peer_type: rr
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_eos3_Ethernet4
  shutdown: false
  mtu: 9214
  ip_address: 10.3.5.5/24
  isis_enable: CORE
  isis_metric: 10
  isis_network_point_to_point: true
  isis_circuit_type: level-2
  isis_hello_padding: true
  mpls:
    ip: true
  metadata:
    peer: eos3
    peer_interface: Ethernet4
    peer_type: pe
  switchport:
    enabled: false
- name: Ethernet1
  description: P2P_eos4_Ethernet3
  shutdown: false
  mtu: 9214
  ip_address: 10.4.5.5/24
  isis_enable: CORE
  isis_metric: 10
  isis_network_point_to_point: true
  isis_circuit_type: level-2
  isis_hello_padding: true
  mpls:
    ip: true
  metadata:
    peer: eos4
    peer_interface: Ethernet3
    peer_type: pe
  switchport:
    enabled: false
- name: Ethernet5
  description: P2P_eos6_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.5.6.5/24
  isis_enable: CORE
  isis_metric: 10
  isis_network_point_to_point: true
  isis_circuit_type: level-2
  isis_hello_padding: true
  mpls:
    ip: true
  metadata:
    peer: eos6
    peer_interface: Ethernet1
    peer_type: pe
  switchport:
    enabled: false
hostname: eos5
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 5.5.5.5/32
  isis_enable: CORE
  isis_passive: true
  node_segment:
    ipv4_index: 5
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: default
management_interfaces:
- name: Management0
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: default
  ip_address: 192.168.0.14/24
  type: oob
  gateway: 192.168.0.1
metadata:
  is_deployed: true
  platform: ceos
  fabric_name: SP_FABRIC
  cv_tags:
    device_tags:
    - name: topology_hint_fabric
      value: SP_FABRIC
mpls:
  ip: true
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65000'
  router_id: 5.5.5.5
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp_cluster_id: 5.5.5.5
  bgp_defaults:
  - no bgp default ipv4-unicast
  - distance bgp 20 200 200
  - graceful-restart restart-time 300
  - graceful-restart
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MPLS-OVERLAY-PEERS
    metadata:
      type: mpls
    remote_as: '65000'
    update_source: Loopback0
    route_reflector_client: true
    bfd: true
    password: N5U6i+3vPyc1DrMdKl+ljQ==
    send_community: all
    maximum_routes: 0
  - name: RR-OVERLAY-PEERS
    metadata:
      type: mpls
    remote_as: '65000'
    update_source: Loopback0
    bfd: true
    password: N5U6i+3vPyc1DrMdKl+ljQ==
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 1.1.1.1
    peer_group: MPLS-OVERLAY-PEERS
    metadata:
      peer: eos1
    description: eos1_Loopback0
  - ip_address: 3.3.3.3
    peer_group: MPLS-OVERLAY-PEERS
    metadata:
      peer: eos3
    description: eos3_Loopback0
  - ip_address: 4.4.4.4
    peer_group: MPLS-OVERLAY-PEERS
    metadata:
      peer: eos4
    description: eos4_Loopback0
  - ip_address: 6.6.6.6
    peer_group: MPLS-OVERLAY-PEERS
    metadata:
      peer: eos6
    description: eos6_Loopback0
  - ip_address: 7.7.7.7
    peer_group: MPLS-OVERLAY-PEERS
    metadata:
      peer: eos7
    description: eos7_Loopback0
  - ip_address: 8.8.8.8
    peer_group: MPLS-OVERLAY-PEERS
    metadata:
      peer: eos8
    description: eos8_Loopback0
  - ip_address: 2.2.2.2
    peer_group: RR-OVERLAY-PEERS
    metadata:
      peer: eos2
    description: eos2_Loopback0
  address_family_evpn:
    neighbor_default:
      encapsulation: mpls
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: true
    - name: RR-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: false
    - name: RR-OVERLAY-PEERS
      activate: false
  address_family_vpn_ipv4:
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: true
    - name: RR-OVERLAY-PEERS
      activate: true
router_isis:
  instance: CORE
  net: 49.0001.0050.0500.5005.00
  router_id: 5.5.5.5
  is_type: level-2
  log_adjacency_changes: true
  timers:
    local_convergence:
      protected_prefixes: true
      delay: 10000
  address_family_ipv4:
    enabled: true
    maximum_paths: 4
    fast_reroute_ti_lfa:
      mode: link-protection
  segment_routing_mpls:
    enabled: true
    router_id: 5.5.5.5
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
static_routes:
- vrf: default
  prefix: 0.0.0.0/0
  next_hop: 192.168.0.1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: default
  ip_routing: false
