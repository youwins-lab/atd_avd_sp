---
# ==========================================================================================
# 고객 서비스 정의
#
# 하나의 AVD 테넌트(SP) 안에 4개 고객 + 1개 공용 서비스를 담습니다.
#
#  Customer 1 : L3VPN   (VRF CUST1)    eos11 / eos13 / eos15   [+ eos12 는 고객 내부 라우터]
#  Customer 2 : L2VPN   (EVPN E-LAN)   eos14 / eos9 / eos10     - 같은 브로드캐스트 도메인
#  Customer 3 : E-LINE  (EVPN VPWS)    eos16 <-> eos17          - 포인트 투 포인트 pseudowire
#  Customer 4 : L3VPN   (VRF CUST4)    eos18 / eos19
#  Centralized: L3VPN   (VRF CENTRAL)  eos20                    - 공용 서비스 허브
#
# PE-CE 링크 IP 는 랩에 이미 배정되어 있는 값을 그대로 씁니다 (10.<PE>.<CE>.<자기ID>/24).
# ==========================================================================================

tenants:
  - name: SP
    mac_vrf_vni_base: 10000

    # VPWS(E-LINE) 인스턴스의 RD/RT 기준값. 이 값이 없으면 AVD 가 `router bgp / vpws`
    # 블록 자체를 만들지 않아서 patch panel 이 참조할 대상이 사라집니다.
    pseudowire_rt_base: 500

    # VPWS pseudowire 공통 설정
    vpws:
      mtu: 9214

    # ======================================================================================
    # Customer 3 - E-LINE (EVPN VPWS pseudowire, 포트 모드)
    #
    #   eos16 --- eos4:Et6  ==[ MPLS pseudowire ]==  eos1:Et6 --- eos17
    #
    # 포트 모드라 eos16/eos17 은 서로 직결된 것처럼 보이고, 실제로 같은 서브넷
    # 10.16.17.0/24 (eos16=.16, eos17=.17) 를 씁니다.
    # ======================================================================================
    point_to_point_services:
      - name: CUST3-ELINE
        type: vpws-pseudowire
        lldp_disable: true
        endpoints:
          - nodes: [eos4]
            interfaces: [Ethernet6]
            id: 316
          - nodes: [eos1]
            interfaces: [Ethernet6]
            id: 317

    # ======================================================================================
    # Customer 2 - L2VPN (EVPN E-LAN over MPLS)
    #
    # SVI 없는 순수 L2 VLAN 입니다. PE 는 브리징만 하고 게이트웨이는 두지 않습니다.
    # 고객 IP 대역은 10.0.0.0/24 (eos9=.9, eos10=.10, eos14=.14).
    #
    # tags 로 이 VLAN 을 내릴 PE 를 제한합니다 (SP_FABRIC.yml 의 node filter.tags 참고).
    # 고객 회선이 없는 eos1 에는 내려가지 않습니다.
    # ======================================================================================
    l2vlans:
      - id: 100
        name: CUST2-L2VPN
        tags: ['cust2']

    vrfs:
      # ==================================================================================
      # Customer 1 - L3VPN
      #   eos1:Et3  <-> eos11:Et1   10.1.11.0/24
      #   eos6:Et3  <-> eos13:Et1   10.6.13.0/24
      #   eos8:Et2  <-> eos15:Et1   10.8.15.0/24
      # CE 는 각자 다른 AS 를 써서 eBGP 로 붙습니다 (eos11/12/13 은 고객 내부 링으로도 연결).
      # ==================================================================================
      - name: CUST1
        vrf_id: 101
        description: Customer 1 L3VPN Service
        address_families: [vpn-ipv4]
        l3_interfaces:
          - nodes: [eos1, eos6, eos8]
            interfaces: [Ethernet3, Ethernet3, Ethernet2]
            ip_addresses: [10.1.11.1/24, 10.6.13.6/24, 10.8.15.8/24]
            descriptions: [CUST1_eos11, CUST1_eos13, CUST1_eos15]
            mtu: 9214
        bgp_peers:
          - ip_address: 10.1.11.11
            remote_as: "65011"
            nodes: [eos1]
            description: eos11
            maximum_routes: 0
          - ip_address: 10.6.13.13
            remote_as: "65013"
            nodes: [eos6]
            description: eos13
            maximum_routes: 0
          - ip_address: 10.8.15.15
            remote_as: "65015"
            nodes: [eos8]
            description: eos15
            maximum_routes: 0
        # 공용 서비스(Centralized L3VPN) 경로를 받아옵니다.
        additional_route_targets:
          - type: import
            address_family: vpn-ipv4
            route_target: "199:199"

      # ==================================================================================
      # Customer 4 - L3VPN
      #   eos8:Et5 <-> eos18:Et1   10.8.18.0/24
      #   eos7:Et4 <-> eos19:Et1   10.7.19.0/24
      # ==================================================================================
      - name: CUST4
        vrf_id: 104
        description: Customer 4 L3VPN Service
        address_families: [vpn-ipv4]
        l3_interfaces:
          - nodes: [eos8, eos7]
            interfaces: [Ethernet5, Ethernet4]
            ip_addresses: [10.8.18.8/24, 10.7.19.7/24]
            descriptions: [CUST4_eos18, CUST4_eos19]
            mtu: 9214
        bgp_peers:
          - ip_address: 10.8.18.18
            remote_as: "65018"
            nodes: [eos8]
            description: eos18
            maximum_routes: 0
          - ip_address: 10.7.19.19
            remote_as: "65019"
            nodes: [eos7]
            description: eos19
            maximum_routes: 0
        additional_route_targets:
          - type: import
            address_family: vpn-ipv4
            route_target: "199:199"

      # ==================================================================================
      # Centralized L3VPN - 공용 서비스 허브
      #   eos3:Et6 <-> eos20:Et1   10.3.20.0/24
      #
      # 자기 경로(199:199)는 Customer 1 / Customer 4 가 import 하고, 반대로 이 VRF 는
      # 두 고객의 RT 를 import 해서 양방향 통신이 되게 합니다(익스트라넷 패턴).
      # 고객끼리는 서로의 RT 를 import 하지 않으므로 Customer 1 <-> Customer 4 는 격리됩니다.
      # ==================================================================================
      - name: CENTRAL
        vrf_id: 199
        description: Centralized L3VPN Shared Service
        address_families: [vpn-ipv4]
        l3_interfaces:
          - nodes: [eos3]
            interfaces: [Ethernet6]
            ip_addresses: [10.3.20.3/24]
            descriptions: [CENTRAL_eos20]
            mtu: 9214
        bgp_peers:
          - ip_address: 10.3.20.20
            remote_as: "65020"
            nodes: [eos3]
            description: eos20
            maximum_routes: 0
        additional_route_targets:
          - type: import
            address_family: vpn-ipv4
            route_target: "101:101"
          - type: import
            address_family: vpn-ipv4
            route_target: "104:104"
