---
# ==========================================================================================
# DCI MPLS-SR EVPN WAN Core 랩 인벤토리 (sites/dci-sr-evpn)
#
# 랩 가이드(L7-Day-2)의 논리 토폴로지를 현재 ATD Pod(eos1~eos20)의 실제 배선에 맞춰
# 매핑한 구성입니다. **관리 IP 는 전혀 바꾸지 않습니다.**
#
#   랩 가이드 역할          장비    MGMT            Loopback0            Node SID
#   ---------------------   ------  --------------  -------------------  --------
#   RR                      eos5    192.168.0.14    192.168.255.14/32    14
#   P1                      eos2    192.168.0.11    192.168.255.11/32    11
#   BL1-DC1 (GW11)          eos1    192.168.0.10    192.168.255.10/32    10
#   BL1-DC2 (GW21)          eos4    192.168.0.13    192.168.255.13/32    13
#   spine1-DC1              eos6    192.168.0.15    192.168.255.15/32     -
#   leaf1-DC1               eos8    192.168.0.17    192.168.255.17/32     -
#   spine1-DC2              eos3    192.168.0.12    192.168.255.12/32     -
#   leaf1-DC2               eos7    192.168.0.16    192.168.255.16/32     -
#   host1-DC1               eos15   192.168.0.24
#   host2-DC1               eos18   192.168.0.27
#   host1-DC2               eos10   192.168.0.19
#   host2-DC2               eos19   192.168.0.28
#
# 랩 가이드의 "X 는 관리 IP 에서 유도한 스위치 ID" 규칙을 그대로 적용해
# Loopback0 = 192.168.255.<관리 IP 마지막 옥텟>, Node SID = 같은 숫자로 잡았습니다.
#
# 미사용 장비 (이 랩에서 쓰지 않음 - 물리적으로 붙을 자리가 없음):
#   eos9, eos11, eos12, eos13, eos14, eos16, eos17, eos20
# ==========================================================================================
DCI_SR_EVPN:
  children:
    CVP:
      hosts:
        cvp:

    # ======================================================================================
    # AVD(eos_designs) 관리 대상 = fabric_name 이 가리키는 그룹
    # ======================================================================================
    DCI_SR_FABRIC:
      children:
        # --------------------------------------------------------------------------------
        # MPLS Segment Routing WAN Core (BGP AS 1)
        # --------------------------------------------------------------------------------
        WAN_CORE:
          children:
            WAN_RR:                   # AVD node type `rr` - iBGP Route Reflector
              hosts:
                eos5:
                  ansible_host: 192.168.0.14
            WAN_P:                    # AVD node type `p`  - 순수 LSR
              hosts:
                eos2:
                  ansible_host: 192.168.0.11

        # --------------------------------------------------------------------------------
        # DC1 EVPN VXLAN 도메인
        # --------------------------------------------------------------------------------
        DC1_FABRIC:
          children:
            DC1_SPINES:
              hosts:
                eos6:
                  ansible_host: 192.168.0.15
            DC1_LEAFS:
              hosts:
                eos8:
                  ansible_host: 192.168.0.17
            # BL1-DC1 (GW11) - DC1 Border Leaf 이자 MPLS PE / EVPN Multidomain Gateway
            DC1_GW:
              hosts:
                eos1:
                  ansible_host: 192.168.0.10

        # --------------------------------------------------------------------------------
        # DC2 EVPN VXLAN 도메인
        # --------------------------------------------------------------------------------
        DC2_FABRIC:
          children:
            DC2_SPINES:
              hosts:
                eos3:
                  ansible_host: 192.168.0.12
            DC2_LEAFS:
              hosts:
                eos7:
                  ansible_host: 192.168.0.16
            # BL1-DC2 (GW21)
            DC2_GW:
              hosts:
                eos4:
                  ansible_host: 192.168.0.13

    # ======================================================================================
    # Tenant A 테스트 호스트 (eos_designs 대상 아님 - host_configs/*.cfg)
    # ======================================================================================
    TENANT_HOSTS:
      children:
        DC1_HOSTS:
          hosts:
            eos15:                    # host1-DC1  172.16.16.51 / 172.16.17.51
              ansible_host: 192.168.0.24
            eos18:                    # host2-DC1  172.16.16.52 / 172.16.17.52
              ansible_host: 192.168.0.27
        DC2_HOSTS:
          hosts:
            eos10:                    # host1-DC2  172.16.16.53 / 172.16.17.53
              ansible_host: 192.168.0.19
            eos19:                    # host2-DC2  172.16.16.54 / 172.16.17.54
              ansible_host: 192.168.0.28

    # ======================================================================================
    # 이 랩에서 사용하지 않는 장비 (설정을 내리지 않습니다)
    # 물리 배선상 DC 패브릭이나 WAN 코어에 넣을 자리가 없어 유휴 상태로 둡니다.
    # ======================================================================================
    UNUSED:
      hosts:
        eos9:
          ansible_host: 192.168.0.18
        eos11:
          ansible_host: 192.168.0.20
        eos12:
          ansible_host: 192.168.0.21
        eos13:
          ansible_host: 192.168.0.22
        eos14:
          ansible_host: 192.168.0.23
        eos16:
          ansible_host: 192.168.0.25
        eos17:
          ansible_host: 192.168.0.26
        eos20:
          ansible_host: 192.168.0.29
