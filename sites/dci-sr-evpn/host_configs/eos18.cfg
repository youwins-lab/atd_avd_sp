! ==========================================================================================
! eos18 = host2-DC1  (Tenant A 테스트 호스트 / eos_designs 대상 아님)
!
!   Ethernet1 -> eos8:Ethernet5  (trunk VLAN 16,17)
!   VLAN 16 : 172.16.16.52/24     게이트웨이(애니캐스트) 172.16.16.254
!   VLAN 17 : 172.16.17.52/24     게이트웨이(애니캐스트) 172.16.17.254
!
! 두 SVI 를 로컬 VRF tenant-a 에 넣습니다. 랩 가이드의 검증 명령과 동일하게
! ping 시 VRF 를 지정해야 합니다:  ping vrf tenant-a 172.16.17.254
!
! 이 파일은 "델타" 입니다. eos_config 로 merge 되며, 랩 초기 상태의 Ethernet1 라우티드
! 주소를 지우기 위해 'no ip address' 를 명시합니다.
! ==========================================================================================
vlan 16
   name TenantA-VLAN16
!
vlan 17
   name TenantA-VLAN17
!
vrf instance tenant-a
!
ip routing vrf tenant-a
!
interface Ethernet1
   description host2-DC1_TO_eos8_Ethernet5
   no ip address
   switchport
   switchport mode trunk
   switchport trunk allowed vlan 16,17
   no shutdown
!
interface Vlan16
   description TenantA-VLAN16
   vrf tenant-a
   no shutdown
   ip address 172.16.16.52/24
!
interface Vlan17
   description TenantA-VLAN17
   vrf tenant-a
   no shutdown
   ip address 172.16.17.52/24
!
ip route vrf tenant-a 0.0.0.0/0 172.16.16.254
