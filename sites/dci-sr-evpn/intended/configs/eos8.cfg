!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname eos8
!
spanning-tree mode rapid-pvst
spanning-tree vlan-id 1-4094 priority 0
!
vlan 16
   name TenantA-VLAN16
!
vlan 17
   name TenantA-VLAN17
!
vrf instance tenant-a
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
interface Ethernet2
   description host1-DC1
   no shutdown
   mtu 9214
   switchport trunk allowed vlan 16,17
   switchport mode trunk
   switchport
!
interface Ethernet3
   description P2P_eos6_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.101.0.33/31
!
interface Ethernet5
   description host2-DC1
   no shutdown
   mtu 9214
   switchport trunk allowed vlan 16,17
   switchport mode trunk
   switchport
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.17/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.255.1.17/32
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.17/24
!
interface Vlan16
   description Tenant-A stretched subnet VLAN16
   no shutdown
   mtu 9014
   vrf tenant-a
   ip address virtual 172.16.16.254/24
!
interface Vlan17
   description Tenant-A stretched subnet VLAN17
   no shutdown
   mtu 9014
   vrf tenant-a
   ip address virtual 172.16.17.254/24
!
interface Vxlan1
   description eos8_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 16 vni 10016
   vxlan vlan 17 vni 10017
   vxlan vrf tenant-a vni 1000
!
ip virtual-router mac-address 00:1c:73:00:00:01
!
ip routing
ip routing vrf tenant-a
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 10.255.1.0/24 eq 32
!
ip route 0.0.0.0/0 192.168.0.1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65012
   router-id 192.168.255.17
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   neighbor default send-community
   graceful-restart restart-time 300
   graceful-restart
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS password 7 HwsUtvRBaFIOmUOBhrtIfQ==
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPV4-UNDERLAY-PEERS peer group
   neighbor IPV4-UNDERLAY-PEERS password 7 X/OrLne2MxtUwJOXyoEcEw==
   neighbor IPV4-UNDERLAY-PEERS send-community
   neighbor IPV4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.101.0.32 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.101.0.32 remote-as 65110
   neighbor 10.101.0.32 description eos6_Ethernet2
   neighbor 192.168.255.15 peer group EVPN-OVERLAY-PEERS
   neighbor 192.168.255.15 remote-as 65110
   neighbor 192.168.255.15 description eos6_Loopback0
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 16
      rd 192.168.255.17:10016
      route-target both 10016:10016
      redistribute learned
   !
   vlan 17
      rd 192.168.255.17:10017
      route-target both 10017:10017
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
      route import match-failure action discard
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPV4-UNDERLAY-PEERS activate
   !
   vrf tenant-a
      rd 192.168.255.17:1000
      route-target import evpn 1000:1000
      route-target export evpn 1000:1000
      router-id 192.168.255.17
      redistribute connected
!
end
