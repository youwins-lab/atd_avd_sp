!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname eos2
!
spanning-tree mode none
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
interface Ethernet2
   description P2P_eos4_Ethernet4
   no shutdown
   mtu 9214
   no switchport
   ip address 10.2.4.2/24
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 10
   isis network point-to-point
!
interface Ethernet3
   description P2P_eos5_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.2.5.2/24
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 10
   isis hello padding
   isis network point-to-point
!
interface Ethernet5
   description P2P_eos1_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.2.2/24
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 10
   isis network point-to-point
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.11/32
   node-segment ipv4 index 11
   isis enable CORE
   isis passive
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.11/24
!
ip routing
!
ip route 0.0.0.0/0 192.168.0.1
!
mpls ip
!
router isis CORE
   net 49.0001.1921.6825.5011.00
   router-id ipv4 192.168.255.11
   is-type level-2
   log-adjacency-changes
   timers local-convergence-delay 10000 protected-prefixes
   !
   address-family ipv4 unicast
      maximum-paths 4
      fast-reroute ti-lfa mode link-protection
   !
   segment-routing mpls
      no shutdown
!
end
