!
no enable password
no aaa root
!
switchport default mode routed
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname eos6
!
spanning-tree mode none
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
interface Ethernet2
   description P2P_eos8_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.101.0.32/31
!
interface Ethernet4
   description P2P_eos1_Ethernet4
   no shutdown
   mtu 9214
   no switchport
   ip address 10.101.0.18/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.15/32
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.15/24
!
ip routing
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
!
ip route 0.0.0.0/0 192.168.0.1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65110
   router-id 192.168.255.15
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   neighbor default send-community
   graceful-restart restart-time 300
   graceful-restart
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS next-hop-unchanged
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS password 7 HwsUtvRBaFIOmUOBhrtIfQ==
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPV4-UNDERLAY-PEERS peer group
   neighbor IPV4-UNDERLAY-PEERS password 7 X/OrLne2MxtUwJOXyoEcEw==
   neighbor IPV4-UNDERLAY-PEERS send-community
   neighbor IPV4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.101.0.19 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.101.0.19 remote-as 1
   neighbor 10.101.0.19 description eos1_Ethernet4
   neighbor 10.101.0.33 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.101.0.33 remote-as 65012
   neighbor 10.101.0.33 description eos8_Ethernet3
   neighbor 192.168.255.10 peer group EVPN-OVERLAY-PEERS
   neighbor 192.168.255.10 remote-as 1
   neighbor 192.168.255.10 description eos1_Loopback0
   neighbor 192.168.255.17 peer group EVPN-OVERLAY-PEERS
   neighbor 192.168.255.17 remote-as 65012
   neighbor 192.168.255.17 description eos8_Loopback0
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPV4-UNDERLAY-PEERS activate
!
end
