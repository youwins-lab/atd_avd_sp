!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname eos4
!
spanning-tree mode rapid-pvst
spanning-tree vlan-id 1-4094 priority 0
!
vlan 16
   name TenantA-VLAN16
!
vlan 17
   name TenantA-VLAN17
!
vrf instance tenant-a
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
interface Ethernet3
   description P2P_eos5_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.4.5.4/24
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 10
   isis network point-to-point
!
interface Ethernet4
   description P2P_eos2_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.2.4.4/24
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 10
   isis network point-to-point
!
interface Ethernet5
   description P2P_eos3_Ethernet5
   no shutdown
   mtu 9214
   no switchport
   ip address 10.102.0.25/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.13/32
   node-segment ipv4 index 13
   isis enable CORE
   isis passive
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.255.1.13/32
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.13/24
!
interface Vlan16
   description Tenant-A stretched subnet VLAN16
   no shutdown
   mtu 9014
   vrf tenant-a
   ip address virtual 172.16.16.254/24
!
interface Vlan17
   description Tenant-A stretched subnet VLAN17
   no shutdown
   mtu 9014
   vrf tenant-a
   ip address virtual 172.16.17.254/24
!
interface Vxlan1
   description eos4_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 16 vni 10016
   vxlan vlan 17 vni 10017
   vxlan vrf tenant-a vni 1000
!
ip virtual-router mac-address 00:1c:73:00:00:01
!
ip routing
ip routing vrf tenant-a
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 10.255.1.0/24 eq 32
!
ip route 0.0.0.0/0 192.168.0.1
!
mpls ip
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 1
   router-id 192.168.255.13
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   neighbor default send-community
   graceful-restart restart-time 300
   graceful-restart
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS password 7 HwsUtvRBaFIOmUOBhrtIfQ==
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPV4-UNDERLAY-PEERS peer group
   neighbor IPV4-UNDERLAY-PEERS password 7 X/OrLne2MxtUwJOXyoEcEw==
   neighbor IPV4-UNDERLAY-PEERS send-community
   neighbor IPV4-UNDERLAY-PEERS maximum-routes 256000
   neighbor MPLS-OVERLAY-PEERS peer group
   neighbor MPLS-OVERLAY-PEERS remote-as 1
   neighbor MPLS-OVERLAY-PEERS update-source Loopback0
   neighbor MPLS-OVERLAY-PEERS bfd
   neighbor MPLS-OVERLAY-PEERS description WAN Core Route Reflector
   neighbor MPLS-OVERLAY-PEERS password 7 N5U6i+3vPyc1DrMdKl+ljQ==
   neighbor MPLS-OVERLAY-PEERS send-community
   neighbor MPLS-OVERLAY-PEERS maximum-routes 0
   neighbor 10.102.0.24 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.102.0.24 remote-as 65220
   neighbor 10.102.0.24 description eos3_Ethernet5
   neighbor 192.168.255.12 peer group EVPN-OVERLAY-PEERS
   neighbor 192.168.255.12 remote-as 65220
   neighbor 192.168.255.12 description eos3_Loopback0
   neighbor 192.168.255.14 peer group MPLS-OVERLAY-PEERS
   neighbor 192.168.255.14 description eos5_Loopback0_RR
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 16
      rd 192.168.255.13:10016
      rd evpn domain remote 192.168.255.13:10016
      route-target both 10016:10016
      route-target import export evpn domain remote 10016:10016
      redistribute learned
   !
   vlan 17
      rd 192.168.255.13:10017
      rd evpn domain remote 192.168.255.13:10017
      route-target both 10017:10017
      route-target import export evpn domain remote 10017:10017
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
      neighbor MPLS-OVERLAY-PEERS activate
      neighbor MPLS-OVERLAY-PEERS encapsulation mpls next-hop-self source-interface Loopback0
      neighbor MPLS-OVERLAY-PEERS domain remote
      domain identifier 65220:1
      domain identifier 1:1 remote
      route import match-failure action discard
      neighbor default next-hop-self received-evpn-routes route-type ip-prefix inter-domain
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPV4-UNDERLAY-PEERS activate
   !
   vrf tenant-a
      rd 192.168.255.13:1000
      route-target import evpn 1000:1000
      route-target export evpn 1000:1000
      router-id 192.168.255.13
      redistribute connected
!
router isis CORE
   net 49.0001.1921.6825.5013.00
   router-id ipv4 192.168.255.13
   is-type level-2
   log-adjacency-changes
   !
   address-family ipv4 unicast
      maximum-paths 4
      fast-reroute ti-lfa mode link-protection
   !
   segment-routing mpls
      no shutdown
!
end
