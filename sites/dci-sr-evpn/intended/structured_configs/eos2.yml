aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet5
  description: P2P_eos1_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.1.2.2/24
  isis_enable: CORE
  isis_metric: 10
  isis_network_point_to_point: true
  isis_circuit_type: level-2
  mpls:
    ip: true
  metadata:
    peer: eos1
    peer_interface: Ethernet1
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_eos4_Ethernet4
  shutdown: false
  mtu: 9214
  ip_address: 10.2.4.2/24
  isis_enable: CORE
  isis_metric: 10
  isis_network_point_to_point: true
  isis_circuit_type: level-2
  mpls:
    ip: true
  metadata:
    peer: eos4
    peer_interface: Ethernet4
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet3
  description: P2P_eos5_Ethernet3
  shutdown: false
  mtu: 9214
  ip_address: 10.2.5.2/24
  isis_enable: CORE
  isis_metric: 10
  isis_network_point_to_point: true
  isis_circuit_type: level-2
  isis_hello_padding: true
  mpls:
    ip: true
  metadata:
    peer: eos5
    peer_interface: Ethernet3
    peer_type: rr
  switchport:
    enabled: false
hostname: eos2
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.255.11/32
  isis_enable: CORE
  isis_passive: true
  node_segment:
    ipv4_index: 11
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: default
management_interfaces:
- name: Management0
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: default
  ip_address: 192.168.0.11/24
  type: oob
  gateway: 192.168.0.1
metadata:
  is_deployed: true
  platform: ceos
  dc_name: WAN
  fabric_name: DCI_SR_FABRIC
  cv_tags:
    device_tags:
    - name: topology_hint_datacenter
      value: WAN
    - name: topology_hint_fabric
      value: DCI_SR_FABRIC
mpls:
  ip: true
router_isis:
  instance: CORE
  net: 49.0001.1921.6825.5011.00
  router_id: 192.168.255.11
  is_type: level-2
  log_adjacency_changes: true
  timers:
    local_convergence:
      protected_prefixes: true
      delay: 10000
  address_family_ipv4:
    enabled: true
    maximum_paths: 4
    fast_reroute_ti_lfa:
      mode: link-protection
  segment_routing_mpls:
    enabled: true
    router_id: 192.168.255.11
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
static_routes:
- vrf: default
  prefix: 0.0.0.0/0
  next_hop: 192.168.0.1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: default
  ip_routing: false
