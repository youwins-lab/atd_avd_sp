aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet4
  description: P2P_eos6_Ethernet4
  shutdown: false
  mtu: 9214
  ip_address: 10.101.0.19/31
  metadata:
    peer: eos6
    peer_interface: Ethernet4
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet1
  description: P2P_eos2_Ethernet5
  shutdown: false
  mtu: 9214
  ip_address: 10.1.2.1/24
  isis_enable: CORE
  isis_metric: 10
  isis_network_point_to_point: true
  isis_circuit_type: level-2
  mpls:
    ip: true
  metadata:
    peer: eos2
    peer_interface: Ethernet5
    peer_type: p
  switchport:
    enabled: false
- name: Ethernet5
  description: P2P_eos5_Ethernet4
  shutdown: false
  mtu: 9214
  ip_address: 10.1.5.1/24
  isis_enable: CORE
  isis_metric: 10
  isis_network_point_to_point: true
  isis_circuit_type: level-2
  mpls:
    ip: true
  metadata:
    peer: eos5
    peer_interface: Ethernet4
    peer_type: rr
  switchport:
    enabled: false
hostname: eos1
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:01
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.255.10/32
  isis_enable: CORE
  isis_passive: true
  node_segment:
    ipv4_index: 10
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.255.1.10/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: default
management_interfaces:
- name: Management0
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: default
  ip_address: 192.168.0.10/24
  type: oob
  gateway: 192.168.0.1
metadata:
  is_deployed: true
  platform: ceos
  rack: DC1-DCI
  dc_name: DC1
  fabric_name: DCI_SR_FABRIC
  cv_tags:
    device_tags:
    - name: topology_hint_datacenter
      value: DC1
    - name: topology_hint_fabric
      value: DCI_SR_FABRIC
    - name: topology_hint_type
      value: edge
    - name: topology_hint_rack
      value: DC1-DCI
mpls:
  ip: true
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.255.0/24 eq 32
  - sequence: 20
    action: permit 10.255.1.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '1'
  router_id: 192.168.255.10
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp_defaults:
  - no bgp default ipv4-unicast
  - distance bgp 20 200 200
  - neighbor default send-community
  - graceful-restart restart-time 300
  - graceful-restart
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPV4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    password: X/OrLne2MxtUwJOXyoEcEw==
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    password: HwsUtvRBaFIOmUOBhrtIfQ==
    send_community: all
    maximum_routes: 0
  - name: MPLS-OVERLAY-PEERS
    remote_as: '1'
    description: WAN Core Route Reflector
    update_source: Loopback0
    bfd: true
    password: N5U6i+3vPyc1DrMdKl+ljQ==
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.101.0.18
    peer_group: IPV4-UNDERLAY-PEERS
    remote_as: '65110'
    metadata:
      peer: eos6
    description: eos6_Ethernet4
  - ip_address: 192.168.255.15
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65110'
    metadata:
      peer: eos6
    description: eos6_Loopback0
  - ip_address: 192.168.255.14
    peer_group: MPLS-OVERLAY-PEERS
    description: eos5_Loopback0_RR
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 16
    metadata:
      tenants:
      - Tenant-A
    rd: 192.168.255.10:10016
    rd_evpn_domain:
      domain: remote
      rd: 192.168.255.10:10016
    route_targets:
      both:
      - 10016:10016
      import_export_evpn_domains:
      - domain: remote
        route_target: 10016:10016
    redistribute_routes:
    - learned
  - id: 17
    metadata:
      tenants:
      - Tenant-A
    rd: 192.168.255.10:10017
    rd_evpn_domain:
      domain: remote
      rd: 192.168.255.10:10017
    route_targets:
      both:
      - 10017:10017
      import_export_evpn_domains:
      - domain: remote
        route_target: 10017:10017
    redistribute_routes:
    - learned
  address_family_evpn:
    domain_identifier: '65110:1'
    domain_identifier_remote: '1:1'
    neighbor_default:
      next_hop_self_received_evpn_routes:
        enable: true
        inter_domain: true
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
    - name: MPLS-OVERLAY-PEERS
      activate: true
      domain_remote: true
      encapsulation: mpls
      next_hop_self_source_interface: Loopback0
    route:
      import_match_failure_action: discard
  address_family_ipv4:
    peer_groups:
    - name: IPV4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: tenant-a
    rd: 192.168.255.10:1000
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - 1000:1000
      export:
      - address_family: evpn
        route_targets:
        - 1000:1000
    router_id: 192.168.255.10
    redistribute:
      connected:
        enabled: true
router_isis:
  instance: CORE
  net: 49.0001.1921.6825.5010.00
  router_id: 192.168.255.10
  is_type: level-2
  log_adjacency_changes: true
  address_family_ipv4:
    enabled: true
    maximum_paths: 4
    fast_reroute_ti_lfa:
      mode: link-protection
  segment_routing_mpls:
    enabled: true
    router_id: 192.168.255.10
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: rapid-pvst
  rapid_pvst_instances:
  - id: 1-4094
    priority: 0
static_routes:
- vrf: default
  prefix: 0.0.0.0/0
  next_hop: 192.168.0.1
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan16
  description: Tenant-A stretched subnet VLAN16
  shutdown: false
  vrf: tenant-a
  ip_address_virtual: 172.16.16.254/24
  mtu: 9014
  metadata:
    tenants:
    - Tenant-A
    tags:
    - DC
- name: Vlan17
  description: Tenant-A stretched subnet VLAN17
  shutdown: false
  vrf: tenant-a
  ip_address_virtual: 172.16.17.254/24
  mtu: 9014
  metadata:
    tenants:
    - Tenant-A
    tags:
    - DC
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 16
  name: TenantA-VLAN16
  metadata:
    tenants:
    - Tenant-A
- id: 17
  name: TenantA-VLAN17
  metadata:
    tenants:
    - Tenant-A
vrfs:
- name: default
  ip_routing: false
- name: tenant-a
  ip_routing: true
  metadata:
    tenants:
    - Tenant-A
vxlan_interface:
  vxlan1:
    description: eos1_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      vlans:
      - id: 16
        vni: 10016
      - id: 17
        vni: 10017
      vrfs:
      - name: tenant-a
        vni: 1000
