aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet3
  description: P2P_eos6_Ethernet2
  shutdown: false
  mtu: 9214
  ip_address: 10.101.0.33/31
  metadata:
    peer: eos6
    peer_interface: Ethernet2
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet2
  description: host1-DC1
  shutdown: false
  mtu: 9214
  metadata:
    peer: eos15
    peer_interface: Ethernet1
    peer_type: server
    peer_key: servers
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: 16,17
- name: Ethernet5
  description: host2-DC1
  shutdown: false
  mtu: 9214
  metadata:
    peer: eos18
    peer_interface: Ethernet1
    peer_type: server
    peer_key: servers
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: 16,17
hostname: eos8
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:01
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.255.17/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.255.1.17/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: default
management_interfaces:
- name: Management0
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: default
  ip_address: 192.168.0.17/24
  type: oob
  gateway: 192.168.0.1
metadata:
  is_deployed: true
  platform: ceos
  dc_name: DC1
  fabric_name: DCI_SR_FABRIC
  cv_tags:
    device_tags:
    - name: topology_hint_datacenter
      value: DC1
    - name: topology_hint_fabric
      value: DCI_SR_FABRIC
    - name: topology_hint_type
      value: leaf
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.255.0/24 eq 32
  - sequence: 20
    action: permit 10.255.1.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65012'
  router_id: 192.168.255.17
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp_defaults:
  - no bgp default ipv4-unicast
  - distance bgp 20 200 200
  - neighbor default send-community
  - graceful-restart restart-time 300
  - graceful-restart
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPV4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    password: X/OrLne2MxtUwJOXyoEcEw==
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    password: HwsUtvRBaFIOmUOBhrtIfQ==
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.101.0.32
    peer_group: IPV4-UNDERLAY-PEERS
    remote_as: '65110'
    metadata:
      peer: eos6
    description: eos6_Ethernet2
  - ip_address: 192.168.255.15
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65110'
    metadata:
      peer: eos6
    description: eos6_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 16
    metadata:
      tenants:
      - Tenant-A
    rd: 192.168.255.17:10016
    route_targets:
      both:
      - 10016:10016
    redistribute_routes:
    - learned
  - id: 17
    metadata:
      tenants:
      - Tenant-A
    rd: 192.168.255.17:10017
    route_targets:
      both:
      - 10017:10017
    redistribute_routes:
    - learned
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
    route:
      import_match_failure_action: discard
  address_family_ipv4:
    peer_groups:
    - name: IPV4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: tenant-a
    rd: 192.168.255.17:1000
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - 1000:1000
      export:
      - address_family: evpn
        route_targets:
        - 1000:1000
    router_id: 192.168.255.17
    redistribute:
      connected:
        enabled: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: rapid-pvst
  rapid_pvst_instances:
  - id: 1-4094
    priority: 0
static_routes:
- vrf: default
  prefix: 0.0.0.0/0
  next_hop: 192.168.0.1
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan16
  description: Tenant-A stretched subnet VLAN16
  shutdown: false
  vrf: tenant-a
  ip_address_virtual: 172.16.16.254/24
  mtu: 9014
  metadata:
    tenants:
    - Tenant-A
    tags:
    - DC
- name: Vlan17
  description: Tenant-A stretched subnet VLAN17
  shutdown: false
  vrf: tenant-a
  ip_address_virtual: 172.16.17.254/24
  mtu: 9014
  metadata:
    tenants:
    - Tenant-A
    tags:
    - DC
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 16
  name: TenantA-VLAN16
  metadata:
    tenants:
    - Tenant-A
- id: 17
  name: TenantA-VLAN17
  metadata:
    tenants:
    - Tenant-A
vrfs:
- name: default
  ip_routing: false
- name: tenant-a
  ip_routing: true
  metadata:
    tenants:
    - Tenant-A
vxlan_interface:
  vxlan1:
    description: eos8_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      vlans:
      - id: 16
        vni: 10016
      - id: 17
        vni: 10017
      vrfs:
      - name: tenant-a
        vni: 1000
