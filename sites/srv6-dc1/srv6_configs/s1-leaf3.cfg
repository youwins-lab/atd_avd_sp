no router bgp 65002
no router bfd
no route-map RM-CONN-2-BGP
no route-map RM-CONN-2-BGP-VRFS
no route-map RM-MLAG-PEER-IN
no ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
no ip prefix-list PL-MLAG-PEER-VRFS
no mlag configuration
no interface Vxlan1
no interface Port-Channel4
no interface Port-Channel1000
no vlan 10
no vlan 20
no vlan 4001
no vlan 4093
no vlan 4094
no vrf instance A
no interface Loopback1
!
no enable password
no aaa root
