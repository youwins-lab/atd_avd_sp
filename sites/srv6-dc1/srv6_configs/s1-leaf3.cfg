ipv6 route fc00:1:111::/48 2001:db8:106::1
ipv6 route fc00:1:333::/48 2001:db8:33::2
ipv6 route 2001:db8:1::23/128 2001:db8:33::2
ipv6 route 2001:db8:1::21/128 2001:db8:105::1
ipv6 route 2001:db8:1::21/128 2001:db8:106::1
