no router bgp 65000
no router bfd
no route-map RM-CONN-2-BGP
no ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname s1-spine1
!
spanning-tree mode none
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
interface Ethernet2
   description SRV6_P2P_s1-leaf1_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ipv6 address 2001:db8:101::1/64
!
interface Ethernet3
   description SRV6_P2P_s1-leaf2_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ipv6 address 2001:db8:103::1/64
!
interface Ethernet4
   description SRV6_P2P_s1-leaf3_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ipv6 address 2001:db8:105::1/64
!
interface Ethernet5
   description UNUSED_was_P2P_s1-leaf4_Ethernet2
   shutdown
!
interface Loopback0
   description SRV6_HOST13_NODE_ID
   no shutdown
   ipv6 address fc00:1:11::/128
!
interface Loopback100
   description SRV6_LOCAL_ADDRESS
   no shutdown
   ipv6 address 2001:db8:1::11/128
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.10/24
!
ip routing
ipv6 unicast-routing
!
router srv6
   vrf default
      local address 2001:db8:1::11
      !
      micro-segment domain Host13
         block fc00:1::/32
      !
      locator Host13
         prefix micro-segment domain Host13 end usid 17
!
ipv6 route fc00:1:101::/48 2001:db8:101::2
ipv6 route fc00:1:103::/48 2001:db8:105::2
ipv6 route fc00:1:111::/48 2001:db8:101::2
ipv6 route fc00:1:333::/48 2001:db8:105::2
ipv6 route 2001:db8:1::21/128 2001:db8:101::2
ipv6 route 2001:db8:1::23/128 2001:db8:105::2
!
ip route 0.0.0.0/0 192.168.0.1
!
end
