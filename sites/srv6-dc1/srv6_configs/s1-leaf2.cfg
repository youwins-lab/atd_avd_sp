no router bgp 65001
no router bfd
no route-map RM-CONN-2-BGP
no route-map RM-CONN-2-BGP-VRFS
no route-map RM-MLAG-PEER-IN
no ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
no ip prefix-list PL-MLAG-PEER-VRFS
no mlag configuration
no interface Vxlan1
no interface Port-Channel4
no interface Port-Channel1000
no vlan 10
no vlan 20
no vlan 4001
no vlan 4093
no vlan 4094
no vrf instance A
no interface Loopback1
!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname s1-leaf2
!
spanning-tree mode none
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
interface Ethernet1
   description UNUSED_was_MLAG_s1-leaf1_Ethernet1
   no channel-group
   shutdown
!
interface Ethernet2
   description SRV6_P2P_s1-spine1_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ipv6 address 2001:db8:103::2/64
!
interface Ethernet3
   description SRV6_P2P_s1-spine2_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ipv6 address 2001:db8:104::2/64
!
interface Ethernet4
   description UNUSED_no_srv6_host_attached
   no channel-group
   shutdown
!
interface Ethernet6
   description UNUSED_was_MLAG_s1-leaf1_Ethernet6
   no channel-group
   shutdown
!
interface Loopback0
   description SRV6_NODE_ID
   no shutdown
   ipv6 address fc00:1:102::/128
!
interface Loopback100
   description SRV6_LOCAL_ADDRESS
   no shutdown
   ipv6 address 2001:db8:1::2/128
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.13/24
!
ip routing
ipv6 unicast-routing
!
router srv6
   vrf default
      local address 2001:db8:1::2
!
ip route 0.0.0.0/0 192.168.0.1
!
end
