---
# SRv6 uSID 데모 전용 독립 inventory. dc1/dc2와 달리 eos_designs/eos_cli_config_gen을 쓰지 않으므로
# dc1_fabric류 계층 구조 없이, 재구성 대상 장비만 담는다.
#
# 이 그룹을 배포하면(make deploy_dc1_srv6_cvp) DC1 EVPN-VXLAN 패브릭(dc1_fabric/dc1_hosts, sites/dc1)이
# 쓰고 있는 실제 장비를 SRv6 uSID 데모용으로 재구성하므로 그쪽 패브릭이 중단된다.
# (되돌리려면 make build_dc1 + make deploy_dc1_cvp, 그리고 make deploy_dc1_host_cvp 재배포)
# 자세한 배경/매핑/주의사항은 sites/srv6-dc1/README.md 참고.
dc1_srv6:
  hosts:
    s1-spine1:
      ansible_host: 192.168.0.10
    s1-spine2:
      ansible_host: 192.168.0.11
    s1-leaf1:
      ansible_host: 192.168.0.12
    s1-leaf2:
      ansible_host: 192.168.0.13
    s1-leaf3:
      ansible_host: 192.168.0.14
    s1-host1:
      ansible_host: 192.168.0.16
    s1-host2:
      ansible_host: 192.168.0.17
