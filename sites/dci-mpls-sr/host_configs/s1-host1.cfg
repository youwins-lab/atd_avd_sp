! ==========================================================================================
! s1-host1 - Tenant A 테스트 엔드포인트 (eos_designs 대상 아님 / 정적 설정)
!
! VLAN 16 / VLAN 17 은 DC1 - DC2 사이에서 스트레치된 서브넷입니다.
! 두 VLAN 을 각각 로컬 VRF 16 / 17 에 넣고, leaf 애니캐스트 게이트웨이로 디폴트 라우트를
! 잡아둡니다. 따라서 테스트 ping 은 반드시 VRF 를 지정해야 합니다.
!   ping vrf 16 10.16.16.21
!   ping vrf 17 10.17.17.21
! ==========================================================================================
vlan 16
   name TenantA-VLAN16
!
vlan 17
   name TenantA-VLAN17
!
vrf instance 16
vrf instance 17
!
ip routing vrf 16
ip routing vrf 17
!
ip route vrf 16 0.0.0.0/0 10.16.16.1
ip route vrf 17 0.0.0.0/0 10.17.17.1
!
interface Ethernet1
   description PortChan1_s1-leaf1_Ethernet4
   channel-group 1 mode active
   no shutdown
!
interface Ethernet2
   description PortChan1_s1-leaf2_Ethernet4
   channel-group 1 mode active
   no shutdown
!
interface Port-Channel1
   description MLAG_TO_s1-leaf1_s1-leaf2
   no shutdown
   switchport mode trunk
   switchport trunk allowed vlan 16,17
!
interface Vlan16
   description TenantA-VLAN16
   vrf 16
   no shutdown
   ip address 10.16.16.11/24
!
interface Vlan17
   description TenantA-VLAN17
   vrf 17
   no shutdown
   ip address 10.17.17.11/24
