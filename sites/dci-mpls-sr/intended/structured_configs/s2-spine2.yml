hostname: s2-spine2
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.255.21/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: default
management_interfaces:
- name: Management0
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: default
  ip_address: 192.168.0.21/24
  type: oob
  gateway: 192.168.0.1
metadata:
  is_deployed: true
  platform: ceos
  rack: DC2-SPINE-RACK
  dc_name: DC2
  fabric_name: MPLS_SR_DCI_FABRIC
  cv_tags:
    device_tags:
    - name: topology_hint_datacenter
      value: DC2
    - name: topology_hint_fabric
      value: MPLS_SR_DCI_FABRIC
    - name: topology_hint_type
      value: spine
    - name: topology_hint_rack
      value: DC2-SPINE-RACK
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.255.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65100'
  router_id: 192.168.255.21
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp_defaults:
  - no bgp default ipv4-unicast
  - distance bgp 20 200 200
  - neighbor default send-community
  - graceful-restart restart-time 300
  - graceful-restart
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPV4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    password: X/OrLne2MxtUwJOXyoEcEw==
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-LOCAL-PEERS
    metadata:
      type: evpn
    next_hop_unchanged: true
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    password: HwsUtvRBaFIOmUOBhrtIfQ==
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.102.0.87
    peer_group: IPV4-UNDERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: s2-leaf1
    description: s2-leaf1_Ethernet3
  - ip_address: 10.102.0.91
    peer_group: IPV4-UNDERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: s2-leaf2
