        inter_domain: true
    peer_groups:
    - name: EVPN-OVERLAY-LOCAL-PEERS
      activate: true
    - name: EVPN-OVERLAY-REMOTE-PEERS
      activate: true
      domain_remote: true
    route:
      import_match_failure_action: discard
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPV4-UNDERLAY-PEER
      activate: true
    - name: IPV4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-LOCAL-PEERS
      activate: false
    - name: EVPN-OVERLAY-REMOTE-PEERS
      activate: false
    - name: IPVPN-GATEWAY-PEERS
      activate: false
  address_family_vpn_ipv4:
