mlag_configuration:
  domain_id: BrdrLeafs
  local_interface: Vlan4094
  peer_address: 10.102.253.142
  peer_link: Port-Channel1000
mpls:
  ip: true
  ldp:
    interface_disabled_default: true
    router_id: 192.168.255.201
    shutdown: false
    transport_address_interface: Loopback0
port_channel_interfaces:
- name: Port-Channel1000
  description: MLAG_s2-brdr1_Port-Channel1000
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.255.0/24 eq 32
  - sequence: 20
    action: permit 192.168.254.0/24 eq 32
- name: PL-MLAG-PEER-VRFS
  sequence_numbers:
  - sequence: 10
    action: permit 10.255.17.142/31
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
- name: RM-CONN-2-BGP-VRFS
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - ip address prefix-list PL-MLAG-PEER-VRFS
  - sequence: 20
    type: permit
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65199'
  router_id: 192.168.255.201
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp_defaults:
  - no bgp default ipv4-unicast
  - distance bgp 20 200 200
  - neighbor default send-community
  - graceful-restart restart-time 300
  - graceful-restart
  bgp:
    default:
      ipv4_unicast: false
    bestpath:
      d_path: true
  peer_groups:
  - name: MLAG-IPV4-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65199'
    description: s2-brdr1
    next_hop_self: true
    password: 96Yo/G3L+2RCoAD4Cy/2Ew==
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  - name: IPV4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    password: X/OrLne2MxtUwJOXyoEcEw==
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-LOCAL-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    password: HwsUtvRBaFIOmUOBhrtIfQ==
    send_community: all
    maximum_routes: 0
  - name: EVPN-OVERLAY-REMOTE-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 15
    password: N5U6i+3vPyc1DrMdKl+ljQ==
    send_community: all
    maximum_routes: 0
  - name: IPVPN-GATEWAY-PEERS
    metadata:
      type: mpls
    update_source: Loopback0
    bfd: true
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.102.255.142
    peer_group: MLAG-IPV4-UNDERLAY-PEER
    metadata:
      peer: s2-brdr1
    description: s2-brdr1_Vlan4093
  - ip_address: 10.102.3.32
    peer_group: IPV4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: s2-spine1
    description: s2-spine1_Ethernet8
  - ip_address: 10.102.3.34
    peer_group: IPV4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: s2-spine2
    description: s2-spine2_Ethernet8
  - ip_address: 192.168.255.20
    peer_group: EVPN-OVERLAY-LOCAL-PEERS
    remote_as: '65100'
    metadata:
      peer: s2-spine1
    description: s2-spine1_Loopback0
  - ip_address: 192.168.255.21
    peer_group: EVPN-OVERLAY-LOCAL-PEERS
    remote_as: '65100'
    metadata:
      peer: s2-spine2
    description: s2-spine2_Loopback0
  - ip_address: 192.168.255.100
    peer_group: EVPN-OVERLAY-REMOTE-PEERS
    remote_as: '65099'
    metadata:
      peer: s1-brdr1
    description: s1-brdr1_Loopback0
  - ip_address: 192.168.255.101
    peer_group: EVPN-OVERLAY-REMOTE-PEERS
    remote_as: '65099'
    metadata:
      peer: s1-brdr2
    description: s1-brdr2_Loopback0
  - ip_address: 192.168.255.202
    peer_group: IPVPN-GATEWAY-PEERS
    remote_as: '1'
    metadata:
      peer: s2-core1
    description: s2-core1
    ebgp_multihop: 15
  - ip_address: 192.168.255.203
    peer_group: IPVPN-GATEWAY-PEERS
    remote_as: '1'
    metadata:
