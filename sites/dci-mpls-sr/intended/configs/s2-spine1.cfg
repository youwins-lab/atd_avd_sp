!
no enable password
no aaa root
!
switchport default mode routed
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname s2-spine1
!
spanning-tree mode none
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
interface Ethernet2
   description P2P_s2-leaf1_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.102.0.84/31
!
interface Ethernet3
   description P2P_s2-leaf2_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.102.0.88/31
!
interface Ethernet4
   description P2P_s2-leaf3_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.102.0.92/31
!
interface Ethernet5
   description P2P_s2-leaf4_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.102.0.96/31
!
interface Ethernet7
   description P2P_s2-brdr1_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.102.3.28/31
!
interface Ethernet8
   description P2P_s2-brdr2_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.102.3.32/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.20/32
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.20/24
!
ip routing
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
!
ip route 0.0.0.0/0 192.168.0.1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65100
   router-id 192.168.255.20
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   neighbor default send-community
   graceful-restart restart-time 300
   graceful-restart
   neighbor EVPN-OVERLAY-LOCAL-PEERS peer group
   neighbor EVPN-OVERLAY-LOCAL-PEERS next-hop-unchanged
   neighbor EVPN-OVERLAY-LOCAL-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-LOCAL-PEERS bfd
   neighbor EVPN-OVERLAY-LOCAL-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-LOCAL-PEERS password 7 HwsUtvRBaFIOmUOBhrtIfQ==
   neighbor EVPN-OVERLAY-LOCAL-PEERS send-community
   neighbor EVPN-OVERLAY-LOCAL-PEERS maximum-routes 0
   neighbor IPV4-UNDERLAY-PEERS peer group
   neighbor IPV4-UNDERLAY-PEERS password 7 X/OrLne2MxtUwJOXyoEcEw==
   neighbor IPV4-UNDERLAY-PEERS send-community
   neighbor IPV4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.102.0.85 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.102.0.85 remote-as 65101
   neighbor 10.102.0.85 description s2-leaf1_Ethernet2
   neighbor 10.102.0.89 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.102.0.89 remote-as 65101
   neighbor 10.102.0.89 description s2-leaf2_Ethernet2
   neighbor 10.102.0.93 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.102.0.93 remote-as 65102
   neighbor 10.102.0.93 description s2-leaf3_Ethernet2
   neighbor 10.102.0.97 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.102.0.97 remote-as 65102
   neighbor 10.102.0.97 description s2-leaf4_Ethernet2
   neighbor 10.102.3.29 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.102.3.29 remote-as 65199
   neighbor 10.102.3.29 description s2-brdr1_Ethernet2
   neighbor 10.102.3.33 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.102.3.33 remote-as 65199
   neighbor 10.102.3.33 description s2-brdr2_Ethernet2
   neighbor 192.168.255.22 peer group EVPN-OVERLAY-LOCAL-PEERS
   neighbor 192.168.255.22 remote-as 65101
   neighbor 192.168.255.22 description s2-leaf1_Loopback0
   neighbor 192.168.255.23 peer group EVPN-OVERLAY-LOCAL-PEERS
   neighbor 192.168.255.23 remote-as 65101
   neighbor 192.168.255.23 description s2-leaf2_Loopback0
   neighbor 192.168.255.24 peer group EVPN-OVERLAY-LOCAL-PEERS
   neighbor 192.168.255.24 remote-as 65102
   neighbor 192.168.255.24 description s2-leaf3_Loopback0
   neighbor 192.168.255.25 peer group EVPN-OVERLAY-LOCAL-PEERS
   neighbor 192.168.255.25 remote-as 65102
   neighbor 192.168.255.25 description s2-leaf4_Loopback0
   neighbor 192.168.255.200 peer group EVPN-OVERLAY-LOCAL-PEERS
   neighbor 192.168.255.200 remote-as 65199
   neighbor 192.168.255.200 description s2-brdr1_Loopback0
   neighbor 192.168.255.201 peer group EVPN-OVERLAY-LOCAL-PEERS
   neighbor 192.168.255.201 remote-as 65199
   neighbor 192.168.255.201 description s2-brdr2_Loopback0
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-LOCAL-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-LOCAL-PEERS activate
      neighbor IPV4-UNDERLAY-PEERS activate
!
end
