!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname s2-leaf2
!
spanning-tree mode rapid-pvst
no spanning-tree vlan-id 4093-4094
spanning-tree vlan-id 1-4094 priority 0
!
vlan 16
   name TenantA-VLAN16
!
vlan 17
   name TenantA-VLAN17
!
vlan 3016
   name MLAG_L3_VRF_tenant-a
   trunk group MLAG
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance tenant-a
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
interface Port-Channel4
   description SERVER_s2-host1
   no shutdown
   switchport trunk allowed vlan 16,17
   switchport mode trunk
   switchport
   mlag 4
!
interface Port-Channel1000
   description MLAG_s2-leaf1_Port-Channel1000
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet1
   description MLAG_s2-leaf1_Ethernet1
   no shutdown
   channel-group 1000 mode active
!
interface Ethernet2
   description P2P_s2-spine1_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.102.0.89/31
!
interface Ethernet3
   description P2P_s2-spine2_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.102.0.91/31
!
interface Ethernet4
   description SERVER_s2-host1_Ethernet2
   no shutdown
   channel-group 4 mode active
!
interface Ethernet6
   description MLAG_s2-leaf1_Ethernet6
   no shutdown
   channel-group 1000 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.23/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.22/32
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.23/24
!
interface Vlan16
   description Tenant-A stretched subnet VLAN16
   no shutdown
   mtu 9014
   vrf tenant-a
   ip address virtual 10.16.16.1/24
!
interface Vlan17
   description Tenant-A stretched subnet VLAN17
   no shutdown
   mtu 9014
   vrf tenant-a
   ip address virtual 10.17.17.1/24
!
interface Vlan3016
   description MLAG_L3_VRF_tenant-a
   no shutdown
   mtu 9214
   vrf tenant-a
   ip address 10.255.16.43/31
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 9214
   ip address 10.102.254.43/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.102.252.43/31
!
interface Vxlan1
   description s2-leaf2_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 16 vni 10016
   vxlan vlan 17 vni 10017
   vxlan vrf tenant-a vni 50016
!
ip virtual-router mac-address 00:1c:73:00:00:01
!
ip routing
ip routing vrf tenant-a
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
!
ip prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 10.255.16.42/31
!
mlag configuration
   domain-id LeafPair1
   local-interface Vlan4094
   peer-address 10.102.252.42
   peer-link Port-Channel1000
!
ip route 0.0.0.0/0 192.168.0.1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65101
   router-id 192.168.255.23
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   neighbor default send-community
   graceful-restart restart-time 300
   graceful-restart
   neighbor EVPN-OVERLAY-LOCAL-PEERS peer group
   neighbor EVPN-OVERLAY-LOCAL-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-LOCAL-PEERS bfd
   neighbor EVPN-OVERLAY-LOCAL-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-LOCAL-PEERS password 7 HwsUtvRBaFIOmUOBhrtIfQ==
   neighbor EVPN-OVERLAY-LOCAL-PEERS send-community
   neighbor EVPN-OVERLAY-LOCAL-PEERS maximum-routes 0
   neighbor IPV4-UNDERLAY-PEERS peer group
   neighbor IPV4-UNDERLAY-PEERS password 7 X/OrLne2MxtUwJOXyoEcEw==
   neighbor IPV4-UNDERLAY-PEERS send-community
   neighbor IPV4-UNDERLAY-PEERS maximum-routes 256000
   neighbor MLAG-IPV4-UNDERLAY-PEER peer group
   neighbor MLAG-IPV4-UNDERLAY-PEER remote-as 65101
   neighbor MLAG-IPV4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPV4-UNDERLAY-PEER description s2-leaf1
   neighbor MLAG-IPV4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPV4-UNDERLAY-PEER password 7 96Yo/G3L+2RCoAD4Cy/2Ew==
   neighbor MLAG-IPV4-UNDERLAY-PEER send-community
   neighbor MLAG-IPV4-UNDERLAY-PEER maximum-routes 256000
   neighbor 10.102.0.88 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.102.0.88 remote-as 65100
   neighbor 10.102.0.88 description s2-spine1_Ethernet3
   neighbor 10.102.0.90 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.102.0.90 remote-as 65100
   neighbor 10.102.0.90 description s2-spine2_Ethernet3
   neighbor 10.102.254.42 peer group MLAG-IPV4-UNDERLAY-PEER
   neighbor 10.102.254.42 description s2-leaf1_Vlan4093
   neighbor 192.168.255.20 peer group EVPN-OVERLAY-LOCAL-PEERS
   neighbor 192.168.255.20 remote-as 65100
   neighbor 192.168.255.20 description s2-spine1_Loopback0
   neighbor 192.168.255.21 peer group EVPN-OVERLAY-LOCAL-PEERS
   neighbor 192.168.255.21 remote-as 65100
   neighbor 192.168.255.21 description s2-spine2_Loopback0
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 16
      rd 192.168.255.23:10016
      route-target both 10016:10016
      redistribute learned
   !
   vlan 17
      rd 192.168.255.23:10017
      route-target both 10017:10017
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-LOCAL-PEERS activate
      route import match-failure action discard
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-LOCAL-PEERS activate
      neighbor IPV4-UNDERLAY-PEERS activate
      neighbor MLAG-IPV4-UNDERLAY-PEER activate
   !
   vrf tenant-a
      rd 192.168.255.23:16
      route-target import evpn 16:16
      route-target export evpn 16:16
      router-id 192.168.255.23
      update wait-install
      neighbor 10.255.16.42 peer group MLAG-IPV4-UNDERLAY-PEER
      neighbor 10.255.16.42 description s2-leaf1_Vlan3016
      redistribute connected route-map RM-CONN-2-BGP-VRFS
!
end
