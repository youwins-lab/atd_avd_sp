!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname s2-brdr2
!
spanning-tree mode rapid-pvst
no spanning-tree vlan-id 4093-4094
spanning-tree vlan-id 1-4094 priority 0
!
vlan 16
   name TenantA-VLAN16
!
vlan 17
   name TenantA-VLAN17
!
vlan 3016
   name MLAG_L3_VRF_tenant-a
   trunk group MLAG
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance tenant-a
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
interface Port-Channel1000
   description MLAG_s2-brdr1_Port-Channel1000
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet1
   description MLAG_s2-brdr1_Ethernet1
   no shutdown
   channel-group 1000 mode active
!
interface Ethernet2
   description P2P_s2-spine1_Ethernet8
   no shutdown
   mtu 9214
   no switchport
   ip address 10.102.3.33/31
!
interface Ethernet3
   description P2P_s2-spine2_Ethernet8
   no shutdown
   mtu 9214
   no switchport
   ip address 10.102.3.35/31
!
interface Ethernet4
   description P2P_s2-core1_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 172.16.2.4/31
   mpls ldp interface
   mpls ip
!
interface Ethernet5
   description P2P_s2-core2_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 172.16.2.6/31
   mpls ldp interface
   mpls ip
!
interface Ethernet6
   description MLAG_s2-brdr1_Ethernet6
   no shutdown
   channel-group 1000 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.201/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 192.168.254.200/32
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.201/24
!
interface Vlan16
   description Tenant-A stretched subnet VLAN16
   no shutdown
   mtu 9014
   vrf tenant-a
   ip address virtual 10.16.16.1/24
!
interface Vlan17
   description Tenant-A stretched subnet VLAN17
   no shutdown
   mtu 9014
   vrf tenant-a
   ip address virtual 10.17.17.1/24
!
interface Vlan3016
   description MLAG_L3_VRF_tenant-a
   no shutdown
   mtu 9214
   vrf tenant-a
   ip address 10.255.17.143/31
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 9214
   ip address 10.102.255.143/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.102.253.143/31
!
interface Vxlan1
   description s2-brdr2_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 16 vni 10016
   vxlan vlan 17 vni 10017
   vxlan vrf tenant-a vni 50016
!
ip virtual-router mac-address 00:1c:73:00:00:01
!
ip routing
ip routing vrf tenant-a
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
!
ip prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 10.255.17.142/31
!
mlag configuration
   domain-id BrdrLeafs
   local-interface Vlan4094
   peer-address 10.102.253.142
   peer-link Port-Channel1000
!
ip route 0.0.0.0/0 192.168.0.1
!
mpls ip
!
mpls ldp
   router-id 192.168.255.201
   transport-address interface Loopback0
   interface disabled default
   no shutdown
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65199
   router-id 192.168.255.201
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   neighbor default send-community
   graceful-restart restart-time 300
   graceful-restart
   bgp bestpath d-path
   neighbor EVPN-OVERLAY-LOCAL-PEERS peer group
   neighbor EVPN-OVERLAY-LOCAL-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-LOCAL-PEERS bfd
   neighbor EVPN-OVERLAY-LOCAL-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-LOCAL-PEERS password 7 HwsUtvRBaFIOmUOBhrtIfQ==
   neighbor EVPN-OVERLAY-LOCAL-PEERS send-community
   neighbor EVPN-OVERLAY-LOCAL-PEERS maximum-routes 0
   neighbor EVPN-OVERLAY-REMOTE-PEERS peer group
   neighbor EVPN-OVERLAY-REMOTE-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-REMOTE-PEERS bfd
   neighbor EVPN-OVERLAY-REMOTE-PEERS ebgp-multihop 15
   neighbor EVPN-OVERLAY-REMOTE-PEERS password 7 N5U6i+3vPyc1DrMdKl+ljQ==
   neighbor EVPN-OVERLAY-REMOTE-PEERS send-community
   neighbor EVPN-OVERLAY-REMOTE-PEERS maximum-routes 0
   neighbor IPV4-UNDERLAY-PEERS peer group
   neighbor IPV4-UNDERLAY-PEERS password 7 X/OrLne2MxtUwJOXyoEcEw==
   neighbor IPV4-UNDERLAY-PEERS send-community
   neighbor IPV4-UNDERLAY-PEERS maximum-routes 256000
   neighbor IPVPN-GATEWAY-PEERS peer group
   neighbor IPVPN-GATEWAY-PEERS update-source Loopback0
   neighbor IPVPN-GATEWAY-PEERS bfd
   neighbor IPVPN-GATEWAY-PEERS send-community
   neighbor IPVPN-GATEWAY-PEERS maximum-routes 0
   neighbor MLAG-IPV4-UNDERLAY-PEER peer group
   neighbor MLAG-IPV4-UNDERLAY-PEER remote-as 65199
   neighbor MLAG-IPV4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPV4-UNDERLAY-PEER description s2-brdr1
   neighbor MLAG-IPV4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPV4-UNDERLAY-PEER password 7 96Yo/G3L+2RCoAD4Cy/2Ew==
   neighbor MLAG-IPV4-UNDERLAY-PEER send-community
   neighbor MLAG-IPV4-UNDERLAY-PEER maximum-routes 256000
   neighbor 10.102.3.32 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.102.3.32 remote-as 65100
   neighbor 10.102.3.32 description s2-spine1_Ethernet8
   neighbor 10.102.3.34 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.102.3.34 remote-as 65100
   neighbor 10.102.3.34 description s2-spine2_Ethernet8
   neighbor 10.102.255.142 peer group MLAG-IPV4-UNDERLAY-PEER
   neighbor 10.102.255.142 description s2-brdr1_Vlan4093
   neighbor 172.16.2.5 peer group IPV4-UNDERLAY-PEERS
   neighbor 172.16.2.5 remote-as 1
   neighbor 172.16.2.5 description s2-core1_Ethernet3
   neighbor 172.16.2.7 peer group IPV4-UNDERLAY-PEERS
   neighbor 172.16.2.7 remote-as 1
   neighbor 172.16.2.7 description s2-core2_Ethernet3
   neighbor 192.168.255.20 peer group EVPN-OVERLAY-LOCAL-PEERS
   neighbor 192.168.255.20 remote-as 65100
   neighbor 192.168.255.20 description s2-spine1_Loopback0
   neighbor 192.168.255.21 peer group EVPN-OVERLAY-LOCAL-PEERS
   neighbor 192.168.255.21 remote-as 65100
   neighbor 192.168.255.21 description s2-spine2_Loopback0
   neighbor 192.168.255.100 peer group EVPN-OVERLAY-REMOTE-PEERS
   neighbor 192.168.255.100 remote-as 65099
   neighbor 192.168.255.100 description s1-brdr1_Loopback0
   neighbor 192.168.255.101 peer group EVPN-OVERLAY-REMOTE-PEERS
   neighbor 192.168.255.101 remote-as 65099
   neighbor 192.168.255.101 description s1-brdr2_Loopback0
   neighbor 192.168.255.202 peer group IPVPN-GATEWAY-PEERS
   neighbor 192.168.255.202 remote-as 1
   neighbor 192.168.255.202 description s2-core1
   neighbor 192.168.255.202 ebgp-multihop 15
   neighbor 192.168.255.203 peer group IPVPN-GATEWAY-PEERS
   neighbor 192.168.255.203 remote-as 1
   neighbor 192.168.255.203 description s2-core2
   neighbor 192.168.255.203 ebgp-multihop 15
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 16
      rd 192.168.255.201:10016
      rd evpn domain remote 192.168.255.201:10016
      route-target both 10016:10016
      route-target import export evpn domain remote 10016:10016
      redistribute learned
   !
   vlan 17
      rd 192.168.255.201:10017
      rd evpn domain remote 192.168.255.201:10017
      route-target both 10017:10017
      route-target import export evpn domain remote 10017:10017
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-LOCAL-PEERS activate
      neighbor EVPN-OVERLAY-REMOTE-PEERS activate
      neighbor EVPN-OVERLAY-REMOTE-PEERS domain remote
      domain identifier 65199:1
      route import match-failure action discard
      neighbor default next-hop-self received-evpn-routes route-type ip-prefix inter-domain
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-LOCAL-PEERS activate
      no neighbor EVPN-OVERLAY-REMOTE-PEERS activate
      neighbor IPV4-UNDERLAY-PEERS activate
      no neighbor IPVPN-GATEWAY-PEERS activate
      neighbor MLAG-IPV4-UNDERLAY-PEER activate
   !
   address-family vpn-ipv4
      neighbor IPVPN-GATEWAY-PEERS activate
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
      domain identifier 1:2
   !
   vrf tenant-a
      rd 192.168.255.201:16
      route-target import evpn 16:16
      route-target export evpn 16:16
      router-id 192.168.255.201
      update wait-install
      neighbor 10.255.17.142 peer group MLAG-IPV4-UNDERLAY-PEER
      neighbor 10.255.17.142 description s2-brdr1_Vlan3016
      redistribute connected route-map RM-CONN-2-BGP-VRFS
!
end
