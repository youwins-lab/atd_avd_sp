!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname s2-core2
!
spanning-tree mode none
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
interface Ethernet1
   description P2P_s2-core1_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.0.0.5/31
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 50
   isis hello padding
   isis network point-to-point
!
interface Ethernet2
   description P2P_s2-brdr1_Ethernet5
   no shutdown
   mtu 9214
   no switchport
   ip address 172.16.2.3/31
   mpls ldp interface
   mpls ip
   isis enable CORE
   isis passive
!
interface Ethernet3
   description P2P_s2-brdr2_Ethernet5
   no shutdown
   mtu 9214
   no switchport
   ip address 172.16.2.7/31
   mpls ldp interface
   mpls ip
   isis enable CORE
   isis passive
!
interface Ethernet4
   description P2P_s1-core2_Ethernet4
   no shutdown
   mtu 9214
   no switchport
   ip address 10.0.0.11/31
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 50
   isis hello padding
   isis network point-to-point
!
interface Ethernet6
   description P2P_s2-core1_Ethernet6
   no shutdown
   mtu 9214
   no switchport
   ip address 10.0.0.7/31
   mpls ip
   isis enable CORE
   isis circuit-type level-2
   isis metric 50
   isis hello padding
   isis network point-to-point
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.203/32
   node-segment ipv4 index 203
   isis enable CORE
   isis passive
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.203/24
!
ip routing
!
ip route 0.0.0.0/0 192.168.0.1
!
mpls ip
!
mpls ldp
   router-id 192.168.255.203
   transport-address interface Loopback0
   interface disabled default
   no shutdown
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 1
   router-id 192.168.255.203
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   graceful-restart restart-time 300
   graceful-restart
   neighbor DC2-GW-PEERS peer group
   neighbor DC2-GW-PEERS remote-as 65199
   neighbor DC2-GW-PEERS update-source Loopback0
   neighbor DC2-GW-PEERS description DC2 Border Leaf IP-VPN Gateways
   neighbor DC2-GW-PEERS ebgp-multihop 15
   neighbor DC2-GW-PEERS send-community
   neighbor DC2-GW-PEERS maximum-routes 0
   neighbor DC2-UNDERLAY-PEERS peer group
   neighbor DC2-UNDERLAY-PEERS remote-as 65199
   neighbor DC2-UNDERLAY-PEERS description DC2 Border Leaf underlay (loopback reachability)
   neighbor DC2-UNDERLAY-PEERS password 7 X/OrLne2MxtUwJOXyoEcEw==
   neighbor DC2-UNDERLAY-PEERS send-community
   neighbor DC2-UNDERLAY-PEERS maximum-routes 0
   neighbor MPLS-OVERLAY-PEERS peer group
   neighbor MPLS-OVERLAY-PEERS remote-as 1
   neighbor MPLS-OVERLAY-PEERS update-source Loopback0
   neighbor MPLS-OVERLAY-PEERS bfd
   neighbor MPLS-OVERLAY-PEERS password 7 N5U6i+3vPyc1DrMdKl+ljQ==
   neighbor MPLS-OVERLAY-PEERS send-community
   neighbor MPLS-OVERLAY-PEERS maximum-routes 0
   neighbor 172.16.2.2 peer group DC2-UNDERLAY-PEERS
   neighbor 172.16.2.2 description s2-brdr1_Ethernet5
   neighbor 172.16.2.6 peer group DC2-UNDERLAY-PEERS
   neighbor 172.16.2.6 description s2-brdr2_Ethernet5
   neighbor 192.168.255.102 peer group MPLS-OVERLAY-PEERS
   neighbor 192.168.255.102 description s1-core1_Loopback0
   neighbor 192.168.255.200 peer group DC2-GW-PEERS
   neighbor 192.168.255.200 description s2-brdr1_Loopback0
   neighbor 192.168.255.201 peer group DC2-GW-PEERS
   neighbor 192.168.255.201 description s2-brdr2_Loopback0
   neighbor 192.168.255.202 peer group MPLS-OVERLAY-PEERS
   neighbor 192.168.255.202 description s2-core1_Loopback0
   !
   address-family evpn
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
      neighbor MPLS-OVERLAY-PEERS activate
   !
   address-family ipv4
      neighbor DC2-UNDERLAY-PEERS activate
      neighbor MPLS-OVERLAY-PEERS activate
      neighbor RR-OVERLAY-PEERS activate
      network 192.168.255.203/32
   !
   address-family vpn-ipv4
      neighbor DC2-GW-PEERS activate
      neighbor MPLS-OVERLAY-PEERS activate
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
!
router isis CORE
   net 49.0001.1921.6825.5203.00
   router-id ipv4 192.168.255.203
   is-type level-2
   log-adjacency-changes
   timers local-convergence-delay 10000 protected-prefixes
   !
   address-family ipv4 unicast
      maximum-paths 4
      fast-reroute ti-lfa mode link-protection
   !
   segment-routing mpls
      no shutdown
!
end
