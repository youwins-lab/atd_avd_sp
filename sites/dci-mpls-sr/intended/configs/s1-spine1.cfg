!
no enable password
no aaa root
!
switchport default mode routed
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname s1-spine1
!
spanning-tree mode none
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf default
      no shutdown
!
interface Ethernet2
   description P2P_s1-leaf1_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.101.0.44/31
!
interface Ethernet3
   description P2P_s1-leaf2_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.101.0.48/31
!
interface Ethernet4
   description P2P_s1-leaf3_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.101.0.52/31
!
interface Ethernet5
   description P2P_s1-leaf4_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.101.0.56/31
!
interface Ethernet7
   description P2P_s1-brdr1_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.101.1.140/31
!
interface Ethernet8
   description P2P_s1-brdr2_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.101.1.144/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 192.168.255.10/32
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.10/24
!
ip routing
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 192.168.255.0/24 eq 32
!
ip route 0.0.0.0/0 192.168.0.1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65000
   router-id 192.168.255.10
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   neighbor default send-community
   graceful-restart restart-time 300
   graceful-restart
   neighbor EVPN-OVERLAY-LOCAL-PEERS peer group
   neighbor EVPN-OVERLAY-LOCAL-PEERS next-hop-unchanged
   neighbor EVPN-OVERLAY-LOCAL-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-LOCAL-PEERS bfd
   neighbor EVPN-OVERLAY-LOCAL-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-LOCAL-PEERS password 7 HwsUtvRBaFIOmUOBhrtIfQ==
   neighbor EVPN-OVERLAY-LOCAL-PEERS send-community
   neighbor EVPN-OVERLAY-LOCAL-PEERS maximum-routes 0
   neighbor IPV4-UNDERLAY-PEERS peer group
   neighbor IPV4-UNDERLAY-PEERS password 7 X/OrLne2MxtUwJOXyoEcEw==
   neighbor IPV4-UNDERLAY-PEERS send-community
   neighbor IPV4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.101.0.45 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.101.0.45 remote-as 65001
   neighbor 10.101.0.45 description s1-leaf1_Ethernet2
   neighbor 10.101.0.49 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.101.0.49 remote-as 65001
   neighbor 10.101.0.49 description s1-leaf2_Ethernet2
   neighbor 10.101.0.53 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.101.0.53 remote-as 65002
   neighbor 10.101.0.53 description s1-leaf3_Ethernet2
   neighbor 10.101.0.57 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.101.0.57 remote-as 65002
   neighbor 10.101.0.57 description s1-leaf4_Ethernet2
   neighbor 10.101.1.141 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.101.1.141 remote-as 65099
   neighbor 10.101.1.141 description s1-brdr1_Ethernet2
   neighbor 10.101.1.145 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.101.1.145 remote-as 65099
   neighbor 10.101.1.145 description s1-brdr2_Ethernet2
   neighbor 192.168.255.12 peer group EVPN-OVERLAY-LOCAL-PEERS
   neighbor 192.168.255.12 remote-as 65001
   neighbor 192.168.255.12 description s1-leaf1_Loopback0
   neighbor 192.168.255.13 peer group EVPN-OVERLAY-LOCAL-PEERS
   neighbor 192.168.255.13 remote-as 65001
   neighbor 192.168.255.13 description s1-leaf2_Loopback0
   neighbor 192.168.255.14 peer group EVPN-OVERLAY-LOCAL-PEERS
   neighbor 192.168.255.14 remote-as 65002
   neighbor 192.168.255.14 description s1-leaf3_Loopback0
   neighbor 192.168.255.15 peer group EVPN-OVERLAY-LOCAL-PEERS
   neighbor 192.168.255.15 remote-as 65002
   neighbor 192.168.255.15 description s1-leaf4_Loopback0
   neighbor 192.168.255.100 peer group EVPN-OVERLAY-LOCAL-PEERS
   neighbor 192.168.255.100 remote-as 65099
   neighbor 192.168.255.100 description s1-brdr1_Loopback0
   neighbor 192.168.255.101 peer group EVPN-OVERLAY-LOCAL-PEERS
   neighbor 192.168.255.101 remote-as 65099
   neighbor 192.168.255.101 description s1-brdr2_Loopback0
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-LOCAL-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-LOCAL-PEERS activate
      neighbor IPV4-UNDERLAY-PEERS activate
!
end
