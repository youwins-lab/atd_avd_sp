---
# ==========================================================================================
# DCI 물리 토폴로지 (core_interfaces)
#
# core_interfaces 는 링크 양쪽 장비가 모두 이 변수를 봐야 하므로, DC 패브릭과 DCI 코어를
# 모두 포함하는 최상위 그룹(DCI_MPLS_SR)에 한 곳으로 모아 정의합니다.
# (자식 그룹에 나눠 쓰면 Ansible group_vars 우선순위 때문에 한쪽이 덮여버립니다.)
#
#                     +----------------+                +----------------+
#     DC1 BL  Et4 --- | s1-core1  (RR) | Et4 ------ Et4 | s2-core1  (RR) | --- Et4  DC2 BL
#     DC1 BL  Et5 --- | s1-core2  (PE) | Et4 ------ Et4 | s2-core2  (PE) | --- Et5  DC2 BL
#                     +----------------+                +----------------+
#                        Et1/Et6 |                          | Et1/Et6
#                       (코어 내부 링크, ISIS-SR)          (코어 내부 링크, ISIS-SR)
#
# IP 계획
#   10.0.0.0/24    : MPLS-SR 코어 내부 P2P (ISIS-SR 활성)
#   172.16.1.0/24  : DC1 Border Leaf <-> DC1 코어 핸드오프 (ISIS 미활성, eBGP + MPLS)
#   172.16.2.0/24  : DC2 Border Leaf <-> DC2 코어 핸드오프 (ISIS 미활성, eBGP + MPLS)
# ==========================================================================================

core_interfaces:
  p2p_links_profiles:
    # --------------------------------------------------------------------------------------
    # MPLS-SR 코어 내부 링크: ISIS "CORE" 언더레이에 포함 -> SR 라벨 경로가 여기로 형성됨
    # --------------------------------------------------------------------------------------
    - name: SR_CORE
      mtu: 9214
      include_in_underlay_protocol: true
      isis_circuit_type: level-2
      isis_network_type: point-to-point
      isis_metric: 50

    # --------------------------------------------------------------------------------------
    # Border Leaf <-> 코어 핸드오프 링크 (Inter-domain / Option-B 스타일)
    #   - include_in_underlay_protocol: false
    #       -> AVD 가 이 링크에 언더레이 프로토콜(ISIS 인접/eBGP 언더레이 이웃)을 자동으로
    #          붙이지 않게 합니다. Border Leaf 는 ISIS 를 돌리지 않는 EVPN-VXLAN 패브릭
    #          장비이므로 SR 인접(adjacency) 경계를 이 링크에서 끊습니다.
    #   - 이 링크 위에는 두 개의 BGP 세션이 올라갑니다(양쪽 다 노드 structured_config 로 작성).
    #       a) 싱글홉 IPv4 unicast : Border Leaf 루프백 <-> 코어 루프백 도달성 확보
    #       b) 멀티홉 vpn-ipv4     : AVD 의 ipvpn_gateway 가 생성 (Loopback0 소스)
    #     (b) 는 (a) 가 만들어 준 루프백 경로 위에서만 올라오므로 순서가 중요합니다.
    #   - 코어 쪽 인터페이스는 ISIS passive 로 넣어 172.16.x.x/31 프리픽스만 SR 도메인
    #     IGP 에 실립니다(인접은 맺지 않음). eBGP next-hop resolve 용입니다.
    #   - 코어(mpls_lsr) 쪽 인터페이스에는 AVD 가 자동으로 `mpls ip` 를 넣습니다.
    #     Border Leaf 쪽 `mpls ip` 는 노드 structured_config 에서 추가합니다.
    # --------------------------------------------------------------------------------------
    - name: DCI_HANDOFF
      mtu: 9214
      include_in_underlay_protocol: false

  p2p_links:
    # ======================================================================================
    # 1) MPLS-SR 코어 내부 링크
    # ======================================================================================
    # --- DC1 사이트 내 코어 페어 (2x 링크) ---
    - nodes: [s1-core1, s1-core2]
      interfaces: [Ethernet1, Ethernet1]
      ip: [10.0.0.0/31, 10.0.0.1/31]
      profile: SR_CORE
    - nodes: [s1-core1, s1-core2]
      interfaces: [Ethernet6, Ethernet6]
      ip: [10.0.0.2/31, 10.0.0.3/31]
      profile: SR_CORE

    # --- DC2 사이트 내 코어 페어 (2x 링크) ---
    - nodes: [s2-core1, s2-core2]
      interfaces: [Ethernet1, Ethernet1]
      ip: [10.0.0.4/31, 10.0.0.5/31]
      profile: SR_CORE
    - nodes: [s2-core1, s2-core2]
      interfaces: [Ethernet6, Ethernet6]
      ip: [10.0.0.6/31, 10.0.0.7/31]
      profile: SR_CORE

    # --- DC1 <-> DC2 광역 DCI 링크 (2x 경로, SR ECMP/TI-LFA 시연용) ---
    - nodes: [s1-core1, s2-core1]
      interfaces: [Ethernet4, Ethernet4]
      ip: [10.0.0.8/31, 10.0.0.9/31]
      profile: SR_CORE
    - nodes: [s1-core2, s2-core2]
      interfaces: [Ethernet4, Ethernet4]
      ip: [10.0.0.10/31, 10.0.0.11/31]
      profile: SR_CORE

    # ======================================================================================
    # 2) DC1 Border Leaf <-> DC1 코어 핸드오프
    # ======================================================================================
    - nodes: [s1-brdr1, s1-core1]
      interfaces: [Ethernet4, Ethernet2]
      ip: [172.16.1.0/31, 172.16.1.1/31]
      profile: DCI_HANDOFF
    - nodes: [s1-brdr1, s1-core2]
      interfaces: [Ethernet5, Ethernet2]
      ip: [172.16.1.2/31, 172.16.1.3/31]
      profile: DCI_HANDOFF
    - nodes: [s1-brdr2, s1-core1]
      interfaces: [Ethernet4, Ethernet3]
      ip: [172.16.1.4/31, 172.16.1.5/31]
      profile: DCI_HANDOFF
    - nodes: [s1-brdr2, s1-core2]
      interfaces: [Ethernet5, Ethernet3]
      ip: [172.16.1.6/31, 172.16.1.7/31]
      profile: DCI_HANDOFF

    # ======================================================================================
    # 3) DC2 Border Leaf <-> DC2 코어 핸드오프
    # ======================================================================================
    - nodes: [s2-brdr1, s2-core1]
      interfaces: [Ethernet4, Ethernet2]
      ip: [172.16.2.0/31, 172.16.2.1/31]
      profile: DCI_HANDOFF
    - nodes: [s2-brdr1, s2-core2]
      interfaces: [Ethernet5, Ethernet2]
      ip: [172.16.2.2/31, 172.16.2.3/31]
      profile: DCI_HANDOFF
    - nodes: [s2-brdr2, s2-core1]
      interfaces: [Ethernet4, Ethernet3]
      ip: [172.16.2.4/31, 172.16.2.5/31]
      profile: DCI_HANDOFF
    - nodes: [s2-brdr2, s2-core2]
      interfaces: [Ethernet5, Ethernet3]
      ip: [172.16.2.6/31, 172.16.2.7/31]
      profile: DCI_HANDOFF
