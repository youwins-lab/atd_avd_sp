---
# ==========================================================================================
# 서버 엔드포인트 접속 포트 (leaf 쪽 포트 설정을 AVD 가 자동 생성)
#
#   s1-host1 -> s1-leaf1 / s1-leaf2  (MLAG port-channel, LACP active)
#   s1-host2 -> s1-leaf3 / s1-leaf4
#   s2-host1 -> s2-leaf1 / s2-leaf2
#   s2-host2 -> s2-leaf3 / s2-leaf4
#
# 호스트 쪽 설정은 eos_designs 대상이 아니고 host_configs/*.cfg 정적 설정으로 배포합니다.
# ==========================================================================================

servers:
  # ---------------------------------------------------------------------------- DC1 ------
  - name: s1-host1
    adapters:
      - endpoint_ports: [Ethernet1, Ethernet2]
        switch_ports: [Ethernet4, Ethernet4]
        switches: [s1-leaf1, s1-leaf2]
        mode: trunk
        vlans: "16,17"
        port_channel:
          mode: active
  - name: s1-host2
    adapters:
      - endpoint_ports: [Ethernet1, Ethernet2]
        switch_ports: [Ethernet4, Ethernet4]
        switches: [s1-leaf3, s1-leaf4]
        mode: trunk
        vlans: "16,17"
        port_channel:
          mode: active

  # ---------------------------------------------------------------------------- DC2 ------
  - name: s2-host1
    adapters:
      - endpoint_ports: [Ethernet1, Ethernet2]
        switch_ports: [Ethernet4, Ethernet4]
        switches: [s2-leaf1, s2-leaf2]
        mode: trunk
        vlans: "16,17"
        port_channel:
          mode: active
  - name: s2-host2
    adapters:
      - endpoint_ports: [Ethernet1, Ethernet2]
        switch_ports: [Ethernet4, Ethernet4]
        switches: [s2-leaf3, s2-leaf4]
        mode: trunk
        vlans: "16,17"
        port_channel:
          mode: active
