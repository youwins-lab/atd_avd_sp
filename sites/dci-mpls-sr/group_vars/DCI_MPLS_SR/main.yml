---
# ==========================================================================================
# 전체 도메인(DC1 / DC2 / DCI 코어) 공통 변수
# ==========================================================================================

# ------------------------------------------------------------------------------------------
# AVD 패브릭 이름
# eos_designs 는 한 플레이 안의 모든 장비가 동일한 fabric_name 을 갖도록 요구하고, 그 이름은
# 해당 장비들을 포함하는 Ansible 그룹이어야 합니다. 이 랩은 세 도메인(DC1 / DC2 / DCI 코어)이
# 서로의 facts 를 참조하므로(Border Leaf 의 evpn_gateway remote_peers, 코어의 RR/Client 관계)
# 하나의 플레이/하나의 fabric_name 으로 묶고, 도메인별 차이는 자식 그룹 변수로 나눕니다.
#   DC1_FABRIC / DC2_FABRIC -> EBGP 언더레이 + EVPN VXLAN 오버레이
#   DCI_CORE                -> ISIS-SR 언더레이 + iBGP(vpn-ipv4/EVPN) 오버레이
# ------------------------------------------------------------------------------------------
fabric_name: MPLS_SR_DCI_FABRIC

# ------------------------------------------------------------------------------------------
# Ansible 접속 정보
# 실제 비밀번호는 같은 디렉터리의 vault.yml 에 ansible-vault 로 암호화되어 있습니다(gitignore).
#   ansible-vault encrypt_string "$LABPASSPHRASE" --name 'vault_ansible_password' \
#     > sites/dci-mpls-sr/group_vars/DCI_MPLS_SR/vault.yml
# ------------------------------------------------------------------------------------------
ansible_user: arista
ansible_password: "{{ vault_ansible_password }}"
ansible_network_os: arista.eos.eos
ansible_become: true
ansible_become_method: enable
ansible_connection: httpapi
ansible_httpapi_port: 443
ansible_httpapi_use_ssl: true
ansible_httpapi_validate_certs: false
ansible_python_interpreter: $(which python3)

# ------------------------------------------------------------------------------------------
# OOB 관리망 - 기존 랩 체계 유지
# ------------------------------------------------------------------------------------------
mgmt_gateway: 192.168.0.1
mgmt_interface_settings:
  interface: Management0
  vrf: default

# AVD 6.x 는 cEOS 관리 인터페이스 기본값이 Management1 이므로 Management0 으로 덮어씁니다.
custom_platform_settings:
  - platforms: ["ceos"]
    management_interface: Management0

# AVD 6.x 는 eAPI 설정 블록을 명시적으로 켜야 렌더링합니다.
management_eapi:
  enabled: true

# ------------------------------------------------------------------------------------------
# Loopback0 주소 체계 (요구사항)
#   "Configure Loopback0 interface on every MPLS router.
#    Use the Loopback 0 IP addresses 192.168.255.x/32 where X is the switch ID,
#    derived from switch Management IP address."
#
# 이 랩에서는 MPLS 코어뿐 아니라 모든 AVD 관리 장비에 동일 규칙을 적용합니다.
#   node `id` = MGMT IP 마지막 옥텟  ->  Loopback0 = 192.168.255.<id>/32
# node 별 loopback_ipv4_pool 은 각 fabric group_vars 에서 이 풀을 그대로 사용합니다.
# ------------------------------------------------------------------------------------------

# CloudVision Topology 뷰용 device tag 자동 생성
generate_cv_tags:
  topology_hints: true

# 패브릭 문서에 링크 CSV 도 같이 생성
eos_designs_documentation:
  topology_csv: true
  p2p_links_csv: true
