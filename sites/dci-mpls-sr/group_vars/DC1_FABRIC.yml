---
# ==========================================================================================
# DC1 EVPN-VXLAN 도메인 (L3LS, eBGP underlay + eBGP EVPN overlay)
# ==========================================================================================
dc_name: DC1

underlay_routing_protocol: EBGP
overlay_routing_protocol: EBGP

p2p_uplinks_mtu: 9214
evpn_import_pruning: true

# EVPN 게이트웨이(멀티도메인) eBGP 세션의 multihop 값
evpn_ebgp_gateway_multihop: 15

bgp_peer_groups:
  ipv4_underlay_peers:
    name: IPV4-UNDERLAY-PEERS
    password: X/OrLne2MxtUwJOXyoEcEw==
  mlag_ipv4_underlay_peer:
    name: MLAG-IPV4-UNDERLAY-PEER
    password: 96Yo/G3L+2RCoAD4Cy/2Ew==
  evpn_overlay_peers:
    name: EVPN-OVERLAY-LOCAL-PEERS
    password: HwsUtvRBaFIOmUOBhrtIfQ==
  # DC1 <-> DC2 Border Leaf 간 멀티도메인 EVPN 세션용 피어 그룹
  evpn_overlay_core:
    name: EVPN-OVERLAY-REMOTE-PEERS
    password: N5U6i+3vPyc1DrMdKl+ljQ==
  # Border Leaf <-> MPLS-SR 코어 IP-VPN 핸드오프 세션용 피어 그룹
  ipvpn_gateway_peers:
    name: IPVPN-GATEWAY-PEERS
    bfd: true

##################################################
# DC1 Spines                                     #
##################################################
spine:
  defaults:
    platform: ceos
    bgp_as: 65000
    # Loopback0 = 192.168.255.<id>/32  (id = MGMT IP 마지막 옥텟)
    loopback_ipv4_pool: 192.168.255.0/24
    rack: DC1-SPINE-RACK
    structured_config:
      switchport_default:
        mode: routed
    bgp_defaults:
      - 'no bgp default ipv4-unicast'
      - 'distance bgp 20 200 200'
      - 'neighbor default send-community'
      - 'graceful-restart restart-time 300'
      - 'graceful-restart'
  nodes:
    - name: s1-spine1
      id: 10
      mgmt_ip: 192.168.0.10/24
    - name: s1-spine2
      id: 11
      mgmt_ip: 192.168.0.11/24

##################################################
# DC1 Leafs / Border Leafs                       #
##################################################
l3leaf:
  defaults:
    platform: ceos
    loopback_ipv4_pool: 192.168.255.0/24
    vtep_loopback_ipv4_pool: 192.168.254.0/24
    uplink_interfaces: [Ethernet2, Ethernet3]
    uplink_switches: [s1-spine1, s1-spine2]
    uplink_ipv4_pool: 10.101.0.0/22
    mlag_interfaces: [Ethernet1, Ethernet6]
    # MLAG 피어 주소는 노드 id 를 인덱스로 풀에서 잘라 씁니다. 이 랩은 node id = MGMT IP
    # 마지막 옥텟(Border Leaf 는 100/101)이라 DC2 와 대칭을 맞춰 /23 으로 잡습니다.
    mlag_peer_ipv4_pool: 10.101.252.0/23
    mlag_peer_l3_ipv4_pool: 10.101.254.0/23
    mlag_port_channel_id: 1000
    virtual_router_mac_address: 00:1c:73:00:00:01
    bgp_defaults:
      - 'no bgp default ipv4-unicast'
      - 'distance bgp 20 200 200'
      - 'neighbor default send-community'
      - 'graceful-restart restart-time 300'
      - 'graceful-restart'
    spanning_tree_mode: rapid-pvst
    spanning_tree_priority: 0

  node_groups:
    # ======================================================================================
    # DC1 Border Leafs = 멀티도메인 EVPN 게이트웨이
    #   s1-brdr1 = BL1-DC1 ("GW11"),  s1-brdr2 = BL2-DC1 (이중화)
    #
    # 두 가지 게이트웨이 기능을 겸합니다.
    #  1) evpn_gateway (evpn_l2 + evpn_l3)
    #     -> 상대 DC 의 Border Leaf 와 eBGP EVPN(멀티홉, Loopback0 소스) 세션.
    #        VLAN 16/17 의 L2 스트레치(Type-2/Type-3 재생성)와 tenant-a 의 L3(IP-Prefix,
    #        next-hop-self) 를 동시에 제공하는 "L2/L3 결합 게이트웨이".
    #        데이터 플레인은 VXLAN 이고, 그 VXLAN 이 MPLS-SR 코어 위를 지나갑니다.
    #  2) ipvpn_gateway
    #     -> 로컬 MPLS-SR 코어 라우터(AS 1)와 eBGP vpn-ipv4 세션.
    #        tenant-a 를 IP-VPN(MPLS) 로 내보내 "DCI Remote IP VPN" 경로를 제공합니다.
    #        D-path 로 EVPN 도메인과 IP-VPN 도메인 사이 루프를 방지합니다.
    # ======================================================================================
    - group: BrdrLeafs
      platform: ceos
      cv_tags_topology_type: edge
      rack: DC1-DCI-RACK
      bgp_as: 65099
      filter:
        tenants: [Tenant-A]
        tags: ['DC']
      uplink_interfaces: [Ethernet2, Ethernet3]
      mlag_interfaces: [Ethernet1, Ethernet6]

      # --- 멀티도메인 L2 + L3 EVPN 결합 게이트웨이 -------------------------------------
      evpn_gateway:
        evpn_l2:
          enabled: true
        evpn_l3:
          enabled: true
          inter_domain: true
        remote_peers:
          - hostname: s2-brdr1
            ip_address: 192.168.255.200
            bgp_as: 65199
          - hostname: s2-brdr2
            ip_address: 192.168.255.201
            bgp_as: 65199

      nodes:
        # ------------------------------------------------------------------ s1-brdr1 ----
        - name: s1-brdr1
          id: 100
          mgmt_ip: 192.168.0.100/24
          uplink_switch_interfaces: [Ethernet7, Ethernet7]
          # EVPN VXLAN <-> IP-VPN(MPLS) 게이트웨이. 로컬 코어 2대와 eBGP vpn-ipv4.
          # AVD 의 IPVPN-GATEWAY-PEERS 피어 그룹은 Loopback0 를 update-source 로 쓰는
          # 멀티홉 세션입니다. 따라서 remote_peers 는 P2P 주소가 아니라 코어의 Loopback0 를
          # 가리켜야 하고, 그 Loopback0 까지의 IPv4 도달성은 아래 IPV4-UNDERLAY-PEERS
          # 싱글홉 세션이 먼저 만들어 줍니다.
          ipvpn_gateway:
            enabled: true
            address_families: [vpn-ipv4]
            enable_d_path: true
            evpn_domain_id: "65099:1"
            ipvpn_domain_id: "1:2"
            maximum_routes: 0
            remote_peers:
              - hostname: s1-core1
                ip_address: 192.168.255.102
                bgp_as: 1
              - hostname: s1-core2
                ip_address: 192.168.255.103
                bgp_as: 1
          structured_config:
            # MPLS 데이터 플레인 + LDP (코어 방향 핸드오프 링크에서만).
            # LDP 는 코어가 이 Border Leaf 의 Loopback0 앞으로 라벨 경로를 만들 수 있게
            # 하기 위한 것입니다. IP-VPN 라우트는 next-hop-self(Loopback0) 로 광고되므로
            # 코어에서 해당 next-hop 을 라벨로 resolve 할 수 있어야 합니다.
            # (코어 내부는 요구사항대로 순수 ISIS Segment Routing 만 사용합니다.)
            mpls:
              ip: true
              ldp:
                router_id: 192.168.255.100
                interface_disabled_default: true
                transport_address_interface: Loopback0
                shutdown: false
            ethernet_interfaces:
              - name: Ethernet4
                mpls:
                  ip: true
                  ldp:
                    interface: true
              - name: Ethernet5
                mpls:
                  ip: true
                  ldp:
                    interface: true
            router_bgp:
              # 핸드오프 링크 위의 싱글홉 eBGP IPv4 unicast 세션.
              # AVD 가 이미 만들어 둔 IPV4-UNDERLAY-PEERS 피어 그룹을 그대로 재사용합니다
              # (update-source 없음 = P2P 주소로 세션이 맺힘, address-family ipv4 활성).
              # 이 세션이 하는 일:
              #   1) Border Leaf 의 Loopback0/Loopback1(VTEP) 을 코어로 광고
              #      -> 상대 DC Border Leaf 까지 전파되어 멀티도메인 EVPN(VXLAN) 세션과
              #         VXLAN 터널이 성립합니다.
              #   2) 코어의 Loopback0 를 학습
              #      -> 위 ipvpn_gateway 멀티홉 vpn-ipv4 세션이 올라올 수 있게 합니다.
              neighbors:
                - ip_address: 172.16.1.1
                  remote_as: 1
                  peer_group: IPV4-UNDERLAY-PEERS
                  description: s1-core1_Ethernet2
                - ip_address: 172.16.1.3
                  remote_as: 1
                  peer_group: IPV4-UNDERLAY-PEERS
                  description: s1-core2_Ethernet2

        # ------------------------------------------------------------------ s1-brdr2 ----
        - name: s1-brdr2
          id: 101
          mgmt_ip: 192.168.0.101/24
          uplink_switch_interfaces: [Ethernet8, Ethernet8]
          ipvpn_gateway:
            enabled: true
            address_families: [vpn-ipv4]
            enable_d_path: true
            evpn_domain_id: "65099:1"
            ipvpn_domain_id: "1:2"
            maximum_routes: 0
            remote_peers:
              - hostname: s1-core1
                ip_address: 192.168.255.102
                bgp_as: 1
              - hostname: s1-core2
                ip_address: 192.168.255.103
                bgp_as: 1
          structured_config:
            mpls:
              ip: true
              ldp:
                router_id: 192.168.255.101
                interface_disabled_default: true
                transport_address_interface: Loopback0
                shutdown: false
            ethernet_interfaces:
              - name: Ethernet4
                mpls:
                  ip: true
                  ldp:
                    interface: true
              - name: Ethernet5
                mpls:
                  ip: true
                  ldp:
                    interface: true
            router_bgp:
              neighbors:
                - ip_address: 172.16.1.5
                  remote_as: 1
                  peer_group: IPV4-UNDERLAY-PEERS
                  description: s1-core1_Ethernet3
                - ip_address: 172.16.1.7
                  remote_as: 1
                  peer_group: IPV4-UNDERLAY-PEERS
                  description: s1-core2_Ethernet3

    ####################################################
    # DC1 Leaf Pair 1                                  #
    ####################################################
    - group: LeafPair1
      bgp_as: 65001
      rack: DC1-RACK1
      filter:
        tenants: [Tenant-A]
        tags: ['DC']
      nodes:
        - name: s1-leaf1
          id: 12
          mgmt_ip: 192.168.0.12/24
          uplink_switch_interfaces: [Ethernet2, Ethernet2]
        - name: s1-leaf2
          id: 13
          mgmt_ip: 192.168.0.13/24
          uplink_switch_interfaces: [Ethernet3, Ethernet3]

    ####################################################
    # DC1 Leaf Pair 2                                  #
    ####################################################
    - group: LeafPair2
      bgp_as: 65002
      rack: DC1-RACK2
      filter:
        tenants: [Tenant-A]
        tags: ['DC']
      nodes:
        - name: s1-leaf3
          id: 14
          mgmt_ip: 192.168.0.14/24
          uplink_switch_interfaces: [Ethernet4, Ethernet4]
        - name: s1-leaf4
          id: 15
          mgmt_ip: 192.168.0.15/24
          uplink_switch_interfaces: [Ethernet5, Ethernet5]
